  </script>
  <script>
    //=== Editor page ===
    //text put into the page's HTML (card names can contain " & < etc.)
    function escHtml(s) {
      return String(s).replace(
        /[&<>"']/g,
        (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
      );
    }
    //typed names: no control characters (they'd break file names), at most max characters
    function cleanText(s, max) {
      return String(s).replace(/[\u0000-\u001f\u007f]/g, " ").slice(0, max);
    }
    const DEFAULT_DECK_NAME = "Untitled Deck";
    const PAGE_TITLE = document.title;

    //=== short messages at the bottom of the page (instead of alert boxes) ===
    //opts: { error: true, action: { label, onClick }, duration (ms) }
    //the same message again restarts its timer instead of stacking a copy
    function showToast(message, opts = {}) {
      const box = document.getElementById("toasts");
      for (const t of box.children) {
        if (t.dataset.text == message) {
          t.restart();
          return t;
        }
      }
      const t = document.createElement("div");
      t.className = "toast" + (opts.error ? " error" : "");
      t.dataset.text = message;
      t.setAttribute("role", opts.error ? "alert" : "status");
      const text = document.createElement("div");
      text.className = "toast-text";
      text.textContent = message;
      t.appendChild(text);
      const close = () => {
        clearTimeout(t.timer);
        t.remove();
      };
      if (opts.action) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = opts.action.label;
        b.addEventListener("click", () => {
          close();
          opts.action.onClick();
        });
        t.appendChild(b);
      }
      const x = document.createElement("button");
      x.type = "button";
      x.className = "toast-close";
      x.setAttribute("aria-label", "Close");
      x.textContent = "✕";
      x.addEventListener("click", close);
      t.appendChild(x);
      //longer messages stay longer; hovering keeps a message open
      const duration = opts.duration || Math.min(12000, 3500 + message.length * 40);
      t.restart = () => {
        clearTimeout(t.timer);
        t.timer = setTimeout(close, duration);
      };
      t.addEventListener("mouseenter", () => clearTimeout(t.timer));
      t.addEventListener("mouseleave", t.restart);
      t.restart();
      box.appendChild(t);
      //at most 3 at a time: the oldest goes
      while (box.children.length > 3) box.firstChild.remove();
      return t;
    }
    //why a card couldn't be added (deckBuilder.refusal), as a message
    function explainRefusal(name) {
      const n = deckBuilder.htmlDecode(name);
      const r = deckBuilder.refusal;
      if (r == "limit") showToast(`You already have 3 copies of “${n}”.`);
      else if (r == "extra") showToast(`“${n}” is an Extra Deck monster: drop it in the Extra Deck.`);
      else if (r == "main") showToast(`“${n}” goes in the Main Deck.`);
    }

    //hold click to view card
    let cardwidth = window.innerWidth * 0.043; //65px when vw is 14141px
    let main = document.getElementById("main");
    let extra = document.getElementById("extra");
    let searchResult = document.getElementById("searchResult");
    let ygolDeck; //created in loadData()
    let deckBuilder; //created in loadData()
    let format = "dl"; //format when the page is first opened
    let currentCard = "";
    let currentCardEl = null;
    let cardDivId = "";
    let mousedown = false;
    let mousehold = false;
    //dragging: a card was pressed and moved at least DRAG_PX (smaller moves still count as a
    //click); dragStart: where the card was pressed
    const DRAG_PX = 6;
    let dragging = false;
    let dragStart = null;
    let clicksInHoldThreshold = 0;
    let poppingup = false;
    let selectingFilters = false;
    let filters = [];
    //the "Free (DL)" filter is switched on automatically in the DLZG format;
    //true only while it's on because of that (not because the user picked it)
    const FREE_DL_FILTER = "Free (DL)";
    let freeFilterAutoOn = false;
    let sort = "Popularity";
    let holdThreshold = 500;
    let _isMobile = window.innerHeight > window.innerWidth;
    let editMode = "view"; //view: a short click shows card info; edit: it adds/removes the card
    //skill name and skill search only show in the Duel Links formats
    function updateSkillVisibility() {
      const dl = format.includes("dl");
      document.getElementById("skillname").style.display = dl ? "block" : "none";
      //inline, so the Clear button sits next to the box like Options next to the card search
      document.getElementById("skillInput").style.display = dl ? "" : "none";
      document.getElementById("skillClear").style.display = dl ? "" : "none";
    }
    updateSkillVisibility();

    //mobile view
    if (_isMobile) {
      editMode = "view";
      cardwidth = window.innerWidth / 8;
      document.head.insertAdjacentHTML(
        "beforeend",
        `<style>
          *{font-weight: 500;}
          #deck{width: 90vw;}
          #main{width: 80vw; height: 50vh; margin-left: auto; margin-right: auto;}
          #extra{width: 80vw; height: 20vh; margin-left: auto; margin-right: auto;}
          input{width: 55vw; height: 5.5vw; font-size: 3.8vw;}
          .minibtn{width: 30vw; height: 7vw; font-size: 3.2vw;}
          .filterbtn{width: 20vw; height: 7vw; font-size: 2.7vw;}
          button{width: 40vw; height: 8vw; font-size: 4vw; font-weight: 500;}
          #popup{font-size: 3.5vw;}
          .cardname{font-size: 4.2vw;}
          .skilltext {font-size: 4.2vw;}
          #controls{display: none;}
          #searchResult{width: 80vw; height: 62vh;}
          #popup{width: 95vw;}
          .filterheader {font-size: 4.2vw;}
          /* room at the top for the site menu icon */
          body{box-sizing: border-box; padding-top: calc(max(1vw, 1.78vh) * 4.4);}
          #body{flex-direction: column; align-items: center;}
          #tabs{display: flex; gap: 2vw; width: 90vw; margin: 0 0 1vw !important;}
          #tabs button{flex: 1; width: auto; height: 9vw; margin: 0;}
        </style>`
      );
      for (let el of document.querySelectorAll("button")) {
        if (el.classList.contains("minibtn")) {
          el.style.width = "27vw";
        }
      }
      //phones use the mode toggle above the deck
      document.getElementById("switchModeDesktop").style.display = "none";
    } else {
      //desktop uses the mode toggle next to the deck name
      document.getElementById("switchMode").style.display = "none";
    }

    //phones: show the deck ("deck") or the search and controls ("search"), picked with the tabs
    function showScreen(name) {
      if (!_isMobile) return;
      document.getElementById("controls").style.display = name == "search" ? "block" : "none";
      document.getElementById("deck").style.display = name == "deck" ? "block" : "none";
      for (const b of document.querySelectorAll("#tabs button"))
        b.classList.toggle("selected", b.dataset.screen == name);
      if (name == "deck") centerCardRows(); //the deck boxes can't be measured while hidden
      if (name == "search") refreshBadges(); //neither can the search results
    }
    showScreen("deck");

    //centre the block of cards in the main/extra deck boxes: rows stay left-aligned, but a full
    //row has the same gap on both sides. Every card takes exactly cardwidth across a row, so the
    //content area is narrowed to a whole number of cards and the rest is split between the left
    //and right padding (the box's outer size doesn't change).
    //while the side deck is shown (it only uses the main box), the extra box is hidden and the
    //main box reaches down to where the extra box's bottom was
    function layoutDeckBoxes() {
      const mainBox = document.getElementById("main");
      const extraBox = document.getElementById("extra");
      mainBox.style.height = "";
      mainBox.style.marginBottom = "";
      extraBox.style.display = "";
      if (!deckBuilder || deckBuilder.editingDeck != "side") return;
      //measure the normal layout first (zero while the deck is hidden: it's measured again
      //when it's shown, see showScreen)
      const top = mainBox.getBoundingClientRect().top;
      const bottom = extraBox.getBoundingClientRect().bottom;
      extraBox.style.display = "none";
      if (bottom > top) {
        //no gap below the main box either, so the page below doesn't move
        mainBox.style.marginBottom = "0px";
        //height is the content height (the width must stay as it is), so take off the
        //vertical padding and borders
        const css = getComputedStyle(mainBox);
        const extraSpace =
          parseFloat(css.paddingTop) +
          parseFloat(css.paddingBottom) +
          parseFloat(css.borderTopWidth) +
          parseFloat(css.borderBottomWidth);
        mainBox.style.height = bottom - top - extraSpace + "px";
      }
    }
    function centerCardRows() {
      layoutDeckBoxes();
      for (const box of [document.getElementById("main"), document.getElementById("extra")]) {
        box.style.width = "";
        box.style.paddingLeft = "";
        box.style.paddingRight = "";
        if (!box.clientWidth) continue; //hidden
        const css = getComputedStyle(box);
        const padL = parseFloat(css.paddingLeft);
        const padR = parseFloat(css.paddingRight);
        const room = box.clientWidth - padL - padR; //space for cards (scrollbar excluded)
        const perRow = Math.max(1, Math.floor((room + 0.01) / cardwidth));
        const slack = 0.5; //px left after the last card, so rounding can't push it to a new row
        const spare = Math.max(0, room - perRow * cardwidth - slack);
        box.style.width = parseFloat(css.width) - spare + "px";
        //the slack sits on the right, so give the left a little more to keep both gaps equal
        box.style.paddingLeft = padL + spare / 2 + slack / 2 + "px";
        box.style.paddingRight = padR + spare / 2 - slack / 2 + "px";
      }
    }
    window.addEventListener("resize", centerCardRows);

    //cards can be dragged in either mode; only a short click differs
    function switchMode() {
      editMode = editMode == "view" ? "edit" : "view";
      const label = editMode == "view" ? "Mode: View" : "Mode: Edit";
      for (const id of ["switchMode", "switchModeDesktop"])
        document.getElementById(id).textContent = label;
    }

    //right click (or Ctrl+click on a Mac, which opens the context menu too). Cards handle it
    //in the contextmenu listener below, so the left-click logic (drag, hold popup, add/remove)
    //ignores these presses
    const _isMac = /Mac/.test(navigator.platform);
    function isSecondaryClick(event) {
      return !!event && (event.button != 0 || (_isMac && event.ctrlKey));
    }
    //right clicking a card shows its info popup instead of the browser menu, except for a deck
    //card in edit mode: that adds another copy right after it (main/extra, or side when the
    //side deck is shown; the 3-copy limit still applies) and shows no popup
    document.addEventListener("contextmenu", (event) => {
      const cardEl = event.target.closest && event.target.closest("img[data-key]");
      if (!cardEl) return;
      //phones: a long press keeps its usual behaviour
      if (event.pointerType == "touch") return;
      event.preventDefault();
      const name = deckBuilder.htmlEncode(decodeURIComponent(cardEl.dataset.key));
      const location = cardEl.getAttribute("location");
      if (
        editMode == "edit" &&
        (location == "main" || location == "extra" || location == "side")
      ) {
        const added = deckBuilder.insertCopyAfter(
          cardEl.getAttribute("cardno"),
          location,
          main,
          extra,
          cardwidth
        );
        if (!added) explainRefusal(name);
        return;
      }
      showCardInfo(name);
    });
    //the card info popup (short click in view mode, click and hold, right click)
    function showCardInfo(name) {
      popupKind = "card";
      document.getElementById("popupCss1").style.display = "flex";
      deckBuilder.displayCard(
        name,
        document.getElementById("popup"),
        //phones: a third of the screen; desktop: the same size as the click-and-hold popup
        _isMobile ? window.innerWidth / 3 : 160
      );
    }

    document.addEventListener("mousedown", (event) => {
      if (isSecondaryClick(event)) return;
      mousedown = true;
      clicksInHoldThreshold += 1;
      setTimeout(() => {
        //a small wobble while holding still counts as holding
        if (mousedown && clicksInHoldThreshold == 1 && !dragging)
          mousehold = true;
        clicksInHoldThreshold -= 1;
      }, holdThreshold);
    });
    //=== dragging cards ===
    //edit mode: search result -> deck adds a copy where it's dropped; deck card -> search
    //results removes it. Either mode: a deck card dropped in its own box moves there.
    //The card stays in place (dimmed) and a copy of it follows the cursor.
    function startDrag() {
      dragging = true;
      const ghost = document.getElementById("ghost");
      const rect = currentCardEl.getBoundingClientRect();
      ghost.style.width = rect.width + "px";
      ghost.innerHTML = "";
      const img = document.createElement("img");
      img.src = currentCardEl.currentSrc || currentCardEl.src;
      img.alt = "";
      ghost.appendChild(img);
      ghost.style.display = "block";
      currentCardEl.classList.add("lifted");
      document.body.classList.add("dragging");
    }
    function moveDrag(event) {
      const ghost = document.getElementById("ghost");
      ghost.style.left = event.clientX - ghost.offsetWidth / 2 + "px";
      ghost.style.top = event.clientY - ghost.offsetHeight / 2 + "px";
      //light up the box the card would go into
      const target = dropTargetAt(event.clientX, event.clientY);
      for (const box of [main, extra, searchResult, switchMainSideBtn])
        box.classList.toggle("dropbox", !!target && target.ok && target.box == box);
    }
    function endDrag() {
      dragging = false;
      document.getElementById("ghost").style.display = "none";
      document.body.classList.remove("dragging");
      for (const el of document.querySelectorAll(".lifted")) el.classList.remove("lifted");
      for (const box of [main, extra, searchResult, switchMainSideBtn]) box.classList.remove("dropbox");
    }
    //what dropping the dragged card at (x, y) would do:
    //{ box, action: "insert" | "remove" | "move" | "toOther", location, ok } or null for nothing
    function dropTargetAt(x, y) {
      const box = dropBoxAt(x, y);
      if (!box || !currentCardEl) return null;
      const from = currentCardEl.getAttribute("location");
      const sideShown = deckBuilder.editingDeck == "side";
      //the View Side/Main Deck button (edit mode): a deck card moves to the other deck, a
      //search result is added to it
      if (box == switchMainSideBtn) {
        if (editMode != "edit") return null;
        const card = deckBuilder.ygolDb.find((a) => a.name == deckBuilder.htmlDecode(currentCard));
        const ok = from != "search" || !!(card && !deckBuilder.atLimit(card.name));
        return { box, action: "toOther", location: from, ok };
      }
      if (from == "search") {
        if (editMode != "edit" || box == searchResult) return null;
        if (sideShown && box == extra) return null;
        const location = sideShown ? "side" : box.id;
        const card = deckBuilder.ygolDb.find((a) => a.name == deckBuilder.htmlDecode(currentCard));
        return { box, action: "insert", location, ok: !deckBuilder.dropRefusal(card, location) };
      }
      if (box == searchResult) return editMode == "edit" ? { box, action: "remove", location: from, ok: true } : null;
      //a deck card moves within its own box only (the side deck is in the main box)
      const ownBox = from == "extra" ? extra : main;
      if (box == ownBox) return { box, action: "move", location: from, ok: true };
      return null;
    }
    //the card box (main/extra/searchResult) under the cursor. The dragged copy has
    //pointer-events: none, so it isn't hit; elementsFromPoint also looks through the
    //click-and-hold popup's overlay
    const switchMainSideBtn = document.getElementById("switchMainSide");
    function dropBoxAt(x, y) {
      for (const el of document.elementsFromPoint(x, y)) {
        const box = el.closest && el.closest("#main, #extra, #searchResult, #switchMainSide");
        if (box) return box;
      }
      return null;
    }
    //where a card dropped at (x, y) goes in a deck box: the number of cards before the cursor,
    //i.e. cards in rows above it, plus cards in its row whose centre is left of it
    function dropIndexAt(box, x, y) {
      let index = 0;
      for (const img of box.querySelectorAll("img[data-key]")) {
        if (img == currentCardEl) continue;
        const r = img.getBoundingClientRect();
        if (r.bottom <= y || (r.top <= y && r.left + r.width / 2 < x)) index++;
      }
      return index;
    }
    //the dragged card was released: add, remove or move it (see dropTargetAt)
    function handleCardDrop(event) {
      const target = dropTargetAt(event.clientX, event.clientY);
      if (!target) return;
      if (target.action == "insert") {
        const added = deckBuilder.insertCardAt(
          currentCard,
          target.location,
          dropIndexAt(target.box, event.clientX, event.clientY),
          main,
          extra,
          cardwidth
        );
        if (!added) explainRefusal(currentCard);
      } else if (target.action == "toOther") {
        //the other deck isn't on screen, so say what happened (and which box the card is in)
        const toName = (card) =>
          deckBuilder.otherDeck() == "side"
            ? "Side Deck"
            : card && card.priorityDl >= 2000000000
            ? "Extra Deck"
            : "Main Deck";
        if (target.location == "search") {
          const name = deckBuilder.htmlDecode(currentCard);
          const card = deckBuilder.ygolDb.find((a) => a.name == name);
          const to = toName(card); //before adding: adding doesn't switch the deck shown
          if (deckBuilder.addToOtherDeck(currentCard, main, extra, cardwidth))
            showToast(`Added “${name}” to the ${to}.`);
          else explainRefusal(currentCard);
        } else {
          const to = deckBuilder.otherDeck();
          const card = deckBuilder.moveToOtherDeck(
            currentCardEl.getAttribute("cardno"),
            target.location,
            main,
            extra,
            cardwidth
          );
          if (card)
            showToast(
              `Moved “${card.name}” to the ${
                to == "side" ? "Side Deck" : card.priorityDl >= 2000000000 ? "Extra Deck" : "Main Deck"
              }.`
            );
        }
      } else if (target.action == "remove") {
        deckBuilder.removeCard(currentCardEl.getAttribute("cardno"), target.location, main, extra, cardwidth);
      } else if (target.action == "move") {
        deckBuilder.moveCard(
          currentCardEl.getAttribute("cardno"),
          dropIndexAt(target.box, event.clientX, event.clientY),
          target.location,
          main,
          extra,
          cardwidth
        );
      }
    }
    //a short click on a search result in edit mode: add it to the shown deck
    function addFromSearch(name) {
      if (!deckBuilder.addCard(name, main, extra, cardwidth)) explainRefusal(name);
    }

    document.addEventListener("mouseup", (event) => {
      if (isSecondaryClick(event)) return;
      const wasDragging = dragging;
      if (wasDragging) {
        handleCardDrop(event);
        endDrag();
      }
      if (
        !wasDragging &&
        //phones: no dragging or holding, so every press on a card counts as a short click
        (_isMobile || !mousehold) &&
        (cardDivId == "main" ||
          cardDivId == "extra" ||
          cardDivId == "searchResult")
      ) {
        if (editMode == "edit") {
          if (cardDivId == "searchResult") {
            addFromSearch(currentCard);
          } else {
            deckBuilder.removeCard(
              currentCardEl.getAttribute("cardno"),
              currentCardEl.getAttribute("location"),
              main,
              extra,
              cardwidth
            );
          }
        } else {
          showCardInfo(currentCard);
        }
      }
      if (poppingup) closeInfoPopup();
      mousedown = false;
      mousehold = false;
      poppingup = false;
      dragStart = null;
      currentCard = "";
      cardDivId = "";
    });
    document.addEventListener("mousemove", (event) => {
      //phones: cards can't be dragged
      if (_isMobile || !mousedown || !cardDivId || !currentCardEl || !dragStart) return;
      if (!dragging) {
        //not while the click-and-hold popup is open, and only past a few pixels, so a
        //slightly shaky click is still a click
        if (mousehold || poppingup) return;
        if (Math.hypot(event.clientX - dragStart.x, event.clientY - dragStart.y) < DRAG_PX) return;
        //view mode: search results can't go anywhere, so they aren't dragged
        if (cardDivId == "searchResult" && editMode != "edit") return;
        startDrag();
      }
      moveDrag(event);
    });
    //close the card/skill/filter popup; closing the filter popup runs the search
    function closeInfoPopup() {
      document.getElementById("popupCss1").style.display = "none";
      const wasFilter = popupKind == "filter";
      popupKind = "card";
      if (wasFilter) runCardSearch();
    }
    document
      .getElementById("popupCss1")
      .addEventListener("mouseup", (event) => {
        //releasing a right click must not close the popup it just opened
        //(on macOS/Linux the context menu opens on press, before the release)
        if (isSecondaryClick(event)) return;
        if (!selectingFilters) closeInfoPopup();
        selectingFilters = false;
      });
    setInterval(() => {
      //phones: no hold-to-view popup (a press already shows the card in view mode)
      if (mousehold && currentCard && !poppingup && !_isMobile && !dragging) {
        poppingup = true;
        showCardInfo(currentCard);
      }
    }, 100);
    //a filter/sort button's label without the whitespace from its HTML layout
    function filterLabel(html) {
      return html.replace(/\s+/g, " ").trim();
    }
    function updateFilterDisplay() {
      for (let el of document
        .getElementById("popup")
        .querySelectorAll("button")) {
        //selected = the current sort or an active filter; styled by button.selected in the css
        const label = filterLabel(el.innerHTML);
        el.classList.toggle("selected", label == sort || filters.includes(label));
      }
    }

    function cardClicked(divid, cardname, el, event) {
      if (isSecondaryClick(event)) return;
      currentCard = cardname;

    //=== card search: runs as you type (300 ms after the last change), Enter runs it at once ===

    let lastSearchKey = null;

    document.getElementById("searchInput").addEventListener("keydown", (e) => {

    function skillSearch() {

          for (let item of results) {

    //the deck's set skill (a skillDb name), or null; shown in #skillname

    }
    //clicking the set skill shows its text in the same popup as card info

    //index of the set skill in skillDb, or null if no skill is set

    //apply the skill read from a yld code (index or null); returns false if it isn't in skillDb
    let missingSkill = null;

    function openFilter() {

    function selectFilter(innerHTMLWithSpaces) {

    function switchMainSide() {

    }
    const FORMATS = ["dl", "dlzg", "md", "tcg", "ocg", "unlimited"];
    //the format button: move to the next format
    function switchFormat() {
      setFormat(FORMATS[(FORMATS.indexOf(format) + 1) % FORMATS.length]);

    //switch straight to a format (also used after uploading a deck)
    function setFormat(newFormat) {
      if (!FORMATS.includes(newFormat)) return;

        "btnFormat"
      ).innerHTML = `Format: ${format.toUpperCase()}`;

        }
      } else if (freeFilterAutoOn) {

    function sortDeck() {

    //=== Clear Deck: asks first, and the clear can be undone ===
    function askClearDeck() {
      if (!deckBuilder) return;
      const nMain = deckBuilder.cards.length;
      const nSide = deckBuilder.side.length;
      const cards = (n) => `${n} ${n == 1 ? "card" : "cards"}`;
      if (!nMain && !nSide) return showToast("The deck is already empty.");
      const choices = [];
      const clear = (which, what) => () => {
        deckBuilder.clearDeck(which, main, extra, cardwidth);

      };
      if (nMain)
        choices.push({
          label: "Clear Main & Extra Deck",
          desc: `Removes ${cards(nMain)}. The Side Deck stays.`,
          onSelect: clear("main", "Main & Extra Deck"),
        });
      if (nSide)
        choices.push({
          label: "Clear Side Deck",
          desc: `Removes ${cards(nSide)}. The Main & Extra Deck stay.`,
          onSelect: clear("side", "Side Deck"),
        });
      if (nMain && nSide)
        choices.push({
          label: "Clear everything",
          desc: `Removes all ${cards(nMain + nSide)}.`,
          onSelect: clear("all", "Deck"),

    function testHands() {
      if (!document.getElementById("deckName").value)
        document.getElementById("deckName").value = "Untitled Deck";
      let namelist = deckBuilder.exportNamelist();
      //cards only: test-hands.html has its own yld decoder, which doesn't read skills
      let yld = ygolDeck.namelist_to_yld(namelist).replace("yld://", "");
      window.open(`test-hands.html?yld=${yld}`);
    }
    //=== copy/download: pick a deck code format first ===
    const EXPORT_FORMATS = [
      { id: "yld", label: "YLD", ext: ".yld", desc: "YGO Lightning deck code. Keeps the side deck and the skill." },
      { id: "ydke", label: "YDKE", ext: ".txt", desc: "Deck code for YGOPro-based simulators." },
      { id: "ydk", label: "YDK", ext: ".ydk", desc: "Deck file for YGOPro-based simulators." },
      { id: "namelist", label: "Card names", ext: ".txt", desc: "One card name per line, in sections." },
    ];
    //the small popup used by Copy, Download and Upload: a title and a list of choices.
    //choices: [{ label, desc (optional), notes, onSelect }]; highlight: label of the option to highlight, or null
    function openChoicePopup(title, choices, highlight = null) {
      document.getElementById("exportTitle").textContent = title;
      const options = document.getElementById("exportOptions");
      options.innerHTML = "";
      for (const c of choices) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "export-option" + (c.label == highlight ? " selected" : "");
        btn.innerHTML = `${c.label}${c.desc ? `<span class="export-desc">${c.desc}</span>` : ""}${(c.notes || [])
          .map((n) => `<span class="export-note">${n}</span>`)
          .join("")}`;
        btn.addEventListener("click", () => {
          closeExport();
          c.onSelect();
        });
        options.appendChild(btn);
      }
      document.getElementById("exportLayer").classList.add("open");
      //focus the highlighted option, or the popup itself when nothing is highlighted
      (options.querySelector(".selected") || document.getElementById("exportBox")).focus();
    }
    //Copy only: the page address with the deck in it (?yld=), which loads the deck when opened
    const LINK_FORMAT = {
      id: "link",
      label: "Link",
      desc: "The address of this page with the deck in it. Opening it loads the deck.",
    };
    function deckLink() {
      const url = new URL(window.location.href);
      url.hash = "";
      url.searchParams.set("yld", exportDeckAs("yld").replace("yld://", ""));
      url.searchParams.delete("d"); //a dlf2p.com deck would be loaded as well
      return url.href;
    }
    function openExport(action) {
      if (!deckBuilder) return;
      const deck = deckBuilder.exportNamelist();
      const noId = cardsWithoutKonamiID(deck).length;
      const formats = action == "copy" ? [EXPORT_FORMATS[0], LINK_FORMAT, ...EXPORT_FORMATS.slice(1)] : EXPORT_FORMATS;
      const choices = formats.map((f) => {
        //what this format would leave out of the current deck
        const notes = [];
        if ((f.id == "ydk" || f.id == "ydke") && noId)
          notes.push(`${noId} ${noId == 1 ? "card has" : "cards have"} no Konami ID and will be left out.`);
        if (f.id != "yld" && f.id != "link" && currentSkill) notes.push("The skill won't be saved.");
        if (f.id == "link") {
          const len = deckLink().length;
          if (len > 2000) notes.push(`Long link (${len.toLocaleString()} characters): some apps and sites may cut it short.`);
        }
        return {
          label: f.label,
          desc: f.desc,
          notes,
          onSelect: () => (action == "copy" ? copyDeckAs(f) : downloadDeckAs(f)),
        };
      });
      //YLD is always highlighted
      openChoicePopup(action == "copy" ? "Copy deck as" : "Download deck as", choices, "YLD");
    }
    //=== upload: from a file or from the clipboard (nothing highlighted) ===
    function openUpload() {
      openChoicePopup("Upload deck from", [
        {
          label: "File",
          onSelect: () => document.getElementById("uploadInput").click(),
        },
        {
          label: "Clipboard",
          onSelect: uploadFromClipboard,
        },
      ]);
    }
    async function uploadFromClipboard() {
      let text = null;
      try {
        text = await navigator.clipboard.readText();
      } catch (e) {
        //the browser blocked reading the clipboard (not https, or permission refused)
      }
      if (text === null) return openPasteBox();
      if (!text.trim()) return showToast("The clipboard is empty.", { error: true });
      loadDeckText(text, null, "clipboard");
    }
    //fallback when the clipboard can't be read directly: paste into a box instead
    function openPasteBox() {
      document.getElementById("exportTitle").textContent = "Paste deck";
      const options = document.getElementById("exportOptions");
      options.innerHTML = "";
      const hint = document.createElement("p");
      hint.className = "export-hint";
      hint.textContent = "Your browser didn't allow reading the clipboard. Paste the deck here (Ctrl+V), then press Load.";
      const box = document.createElement("textarea");
      box.setAttribute("aria-label", "Deck code or card list");
      const load = document.createElement("button");
      load.type = "button";
      load.className = "export-option";
      load.textContent = "Load";
      load.addEventListener("click", () => {
        if (!box.value.trim()) return box.focus();
        closeExport();
        loadDeckText(box.value, null, "clipboard");
      });
      options.append(hint, box, load);
      document.getElementById("exportLayer").classList.add("open");
      box.focus();
    }
    function closeExport() {
      document.getElementById("exportLayer").classList.remove("open");
    }
    //names (with repeats) of the deck's cards that have no Konami ID (can't go in ydk/ydke)
    function cardsWithoutKonamiID(namelist) {
      return namelist
        .split("\n")
        .filter((a) => a && a != "#main" && a != "#extra" && a != "!side")
        .filter((name) => !(cardDb.find((c) => c.name == name) || {}).konamiID);
    }
    //the current deck as a code/file in the chosen format
    function exportDeckAs(formatId) {
      let namelist = deckBuilder.exportNamelist();
      if (formatId == "ydk" || formatId == "ydke") {
        //cards without a Konami ID would break these formats, so they're left out
        const skip = new Set(cardsWithoutKonamiID(namelist));
        namelist = namelist
          .split("\n")
          .filter((a) => !skip.has(a))
          .join("\n");
      }
      return ygolDeck.convert(namelist, formatId, formatId == "yld" ? currentSkillIndex() : null);
    }
    async function copyDeckAs(f) {
      const text = f.id == "link" ? deckLink() : exportDeckAs(f.id);
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (e) {
        //older browsers / non-https pages: copy through a hidden textarea
        const input = document.createElement("textarea");
        input.value = text;
        document.body.appendChild(input);
        input.select();
        ok = document.execCommand("copy");
        document.body.removeChild(input);
      }
      const btn = document.getElementById("copyDeck");
      btn.textContent = ok ? `Copied ${f.label}!` : "Copy failed";
      setTimeout(() => (btn.textContent = "Copy"), 2000);
    }
    function downloadDeckAs(f) {
      if (!document.getElementById("deckName").value)
        document.getElementById("deckName").value = "Untitled Deck";
      let name = document.getElementById("deckName").value;
      let text = exportDeckAs(f.id);
      //strip characters that aren't allowed in file names
      let fileName =
        name.replace(/[\\/:*?"<>|]/g, "").trim() || "Untitled Deck";
      const blob = new Blob([text], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName + f.ext;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    //tell the user which cards were skipped by the last ygolDeck.convert()
    function reportMissingCards() {
      let parts = [];
      if (ygolDeck.missing.length) {
        let counts = {};
        for (let name of ygolDeck.missing) counts[name] = (counts[name] || 0) + 1;
        let lines = Object.entries(counts).map(
          ([name, n]) => `- ${name}${n > 1 ? ` x${n}` : ""}`
        );
        if (lines.length > 20)
          lines = lines.slice(0, 20).concat(`...and ${lines.length - 20} more`);
        parts.push(
          `${ygolDeck.missing.length} card(s) in this deck are not in the card database and were skipped:\n${lines.join("\n")}`
        );
      }
      if (missingSkill !== null)
        parts.push(`The deck's skill (ID ${missingSkill}) is not in the skill database, so no skill was set.`);
      if (parts.length) showToast(parts.join("\n\n"), { error: true });
    }

    //which deck format a piece of text is (same rules as YgolDeck.toNamelist)
    function detectDeckFormat(text) {
      if (text.includes("#main") || text.includes("#extra")) return "ydk/namelist";
      if (text.includes("ydke://")) return "ydke";
      if (text.includes("yld://")) return "yld";
      return "dlf2pV2";
    }
    //upload accepts every format the converter reads: yld, ydk, ydke, dlf2pV2 or a list of card names
    //upload accepts every format the converter reads: yld, ydk, ydke, dlf2pV2 or a list of card names
    function loadUploadedDeck(input) {
      const file = input.files[0];
      input.value = ""; //allow re-uploading the same file
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () =>
        loadDeckText(reader.result, file.name.replace(/\.(yld|ydk|ydke|txt)$/i, ""), "file");
      reader.readAsText(file);
    }
    //load a deck from text (a file's contents or the clipboard), replacing the current deck.
    //name: deck name to show (null: "Untitled Deck"); source: "file" or "clipboard", for the error message
    function loadDeckText(rawText, name, source) {
      const prevName = document.getElementById("deckName").value;
      const prevFormat = format;
      //Windows line endings would stick to card names, so normalise them first
      let text = rawText.replace(/\r\n?/g, "\n").trim();
      let namelist, skill = null;
      try {
        if (!text) throw new Error();
        const kind = detectDeckFormat(text);
        namelist = ygolDeck.convert(text, "namelist");
        if (typeof namelist != "string") throw new Error();
        if (kind == "yld") skill = ygolDeck.skill;
        if (kind == "dlf2pV2") {
          //dlf2pV2 is [2_]<cards>_<skill index>_<deck name>; -1 means no skill
          const n = parseInt(text.replace(/^2_/, "").split("_")[1]);
          if (n >= 0) skill = n;
        }
        //unknown cards are skipped, but a deck with no valid cards at all is rejected
        let validCards = namelist
          .split("\n")
          .filter((a) => a && a != "#main" && a != "#extra" && a != "!side");
        if (!validCards.length && ygolDeck.missing.length) throw new Error();
      } catch (e) {
        showToast(
          source == "clipboard"
            ? "The clipboard doesn't contain a deck the editor can read."
            : "This file isn't a deck file the editor can read.",
          { error: true }
        );
        return false;
      }
      //clear the current deck, then load the uploaded one
      if (deckBuilder.editingDeck == "side") switchMainSide();
      deckBuilder.cards = [];
      deckBuilder.side = [];
      deckBuilder.importNamelist(namelist, main, extra, cardwidth);
      deckBuilder.appendDeck(main, extra, cardwidth);
      document.getElementById("deckName").value = cleanText(name || "", 60).trim() || DEFAULT_DECK_NAME;
      updateTitle();
      const hasSkill = applyDecodedSkill(skill) && skill !== null; //the uploaded deck's skill, or none
      //pick a matching format: a skill means Duel Links; otherwise a side deck means TCG
      if (hasSkill) setFormat("dl");
      else if (deckBuilder.side.length) setFormat("tcg");
      //phones: switch from the controls panel to the deck so the uploaded cards are shown
      showScreen("deck");
      pushDeckUrl(prevName, prevFormat);
      showToast(`Loaded “${document.getElementById("deckName").value}”.`, {
        action: { label: "Undo", onClick: undo },
      });
      reportMissingCards();
      return true;
    }

    //=== the deck in the page URL (?yld=) ===
    //the URL deck that is loaded, so going back/forward only reloads the deck when it changes
    function urlDeckKey() {
      const p = new URL(window.location.href).searchParams;
      return (p.get("yld") || "") + "|" + (p.get("d") || "");
    }
    let loadedUrlDeck = urlDeckKey();
    //after an upload: put the deck's yld code in the URL, as a new history entry (no reload).
    //prevName/prevFormat: the deck name and format before the upload, kept in the previous
    //entry for going back
    function pushDeckUrl(prevName, prevFormat) {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set("yld", exportDeckAs("yld").replace("yld://", ""));
        //a dlf2p.com deck (?d=) would be loaded as well as the yld one
        url.searchParams.delete("d");
        //deck names and formats aren't in the URL, so each history entry keeps its own
        history.replaceState(
          Object.assign({}, history.state, { deckName: prevName, format: prevFormat }),
          ""
        );
        history.pushState(
          { deckName: document.getElementById("deckName").value, format: format },
          "",
          url
        );
        loadedUrlDeck = urlDeckKey();
      } catch (e) {
        console.error("Could not update the URL", e);
      }
    }
    //the format is remembered in the current history entry, so going back/forward to this
    //deck brings back the format last used with it
    function rememberFormatInHistory() {
      try {
        history.replaceState(Object.assign({}, history.state, { format: format }), "");
      } catch (e) {}
    }
    //back/forward: load the deck and format of that history entry
    window.addEventListener("popstate", (event) => {
      if (!deckBuilder || urlDeckKey() == loadedUrlDeck) return; //e.g. only the #hash changed
      const state = event.state || {};
      loadDeckFromUrl(true, state.deckName || null);
      if (state.format && state.format != format) setFormat(state.format);
    });
    //load the deck in the URL: ?yld=, or ?d= on dlf2p.com.
    //clear: replace the current deck (back/forward), with deckName as its name if given
    function loadDeckFromUrl(clear = false, deckName = null) {
      const params = new URL(window.location.href).searchParams;
      loadedUrlDeck = urlDeckKey();
      if (clear) {
        if (deckBuilder.editingDeck == "side") switchMainSide();
        deckBuilder.cards = [];
        deckBuilder.side = [];
        deckBuilder.appendDeck(main, extra, cardwidth);
        applyDecodedSkill(null);
        document.getElementById("deckName").value = "Untitled Deck";
      }
      if (params.get("dlf2p") == "true" && params.get("d")) {
        document.getElementById("deckName").value = params
          .get("d")
          .slice(2)
          .split("_")[2];
        deckBuilder.importNamelist(
          ygolDeck.convert(params.get("d"), "namelist"),
          main,
          extra,
          cardwidth
        );
        reportMissingCards();
        //d is 2_<cards>_<skill index>_<deck name>; skill may be -1 or no longer exist
        let skill = skillDb[params.get("d").split("_")[2]];
        if (skill) setSkill(skill.name);
      }
      //normal ygol: load deck from ?yld=
      if (params.get("yld")) {
        let namelist;
        try {
          namelist = ygolDeck.convert("yld://" + params.get("yld"), "namelist");
        } catch (e) {
          showToast("The deck code in the page address isn't valid.", { error: true });
        }
        if (namelist) {
          const skill = ygolDeck.skill;
          deckBuilder.importNamelist(namelist, main, extra, cardwidth);
          const hasSkill = applyDecodedSkill(skill) && skill !== null;
          //on page load, pick a matching format like an upload does: a skill means
          //Duel Links; otherwise a side deck means TCG (back/forward keeps the format)
          if (!clear) {
            if (hasSkill) setFormat("dl");
            else if (deckBuilder.side.length) setFormat("tcg");
          }
          reportMissingCards();
        }
      }
      if (clear && deckName) document.getElementById("deckName").value = deckName;
      updateTitle();
    }

    //=== after every deck change: undo history, the "✓ N" badges, the page address, saving ===
    //DeckBuilder calls scheduleDeckChange after each redraw (deckBuilder.onRender) and setSkill
    //calls it too; changes made in one go (e.g. loading a deck card by card) are handled once.
    //A snapshot is the deck's cards, side deck, skill and name; only the first three count as
    //a change (typing a name isn't an undo step), but undo brings the name back with them.
    let lastSnap = null; //the deck after the last change (null until the first load is done)
    const undoStack = [];
    const redoStack = [];
    const MAX_UNDO = 100;
    let deckChangeQueued = false;
    let cardByName = new Map(); //card name -> card object (set in loadData)
    function deckSnapshot() {
      return {
        main: deckBuilder.cards.map((c) => c.name),
        side: deckBuilder.side.map((c) => c.name),
        skill: currentSkill,
        name: document.getElementById("deckName").value,
      };
    }
    const snapKey = (s) => JSON.stringify([s.main, s.side, s.skill]);
    function scheduleDeckChange() {
      if (!deckBuilder || deckChangeQueued) return;
      deckChangeQueued = true;
      queueMicrotask(flushDeckChange);
    }
    function flushDeckChange() {
      deckChangeQueued = false;
      const snap = deckSnapshot();
      if (lastSnap && snapKey(snap) != snapKey(lastSnap)) {
        undoStack.push(lastSnap);
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack.length = 0;
      }
      lastSnap = snap;
      refreshBadges();
      syncDeckUrl();
      updateTitle();
      saveSoon();
    }
    //put a snapshot back (undo/redo)
    function applySnapshot(s) {
      lastSnap = s; //so the redraw below doesn't count as a new change
      deckBuilder.cards = s.main.map((n) => cardByName.get(n)).filter(Boolean);
      deckBuilder.side = s.side.map((n) => cardByName.get(n)).filter(Boolean);
      document.getElementById("deckName").value = s.name;
      setSkill(s.skill);
      deckBuilder.render(main, extra, cardwidth);
    }
    function undo() {
      if (!deckBuilder) return;
      if (!undoStack.length) return showToast("Nothing to undo.", { duration: 1800 });
      redoStack.push(deckSnapshot());
      applySnapshot(undoStack.pop());
      showToast("Undone.", { duration: 1500 });
    }
    function redo() {
      if (!deckBuilder) return;
      if (!redoStack.length) return showToast("Nothing to redo.", { duration: 1800 });
      undoStack.push(deckSnapshot());
      applySnapshot(redoStack.pop());
      showToast("Redone.", { duration: 1500 });
    }

    //the deck's code for the page address: "" for an empty deck with no skill
    function deckUrlCode() {
      if (!deckBuilder.cards.length && !deckBuilder.side.length && currentSkillIndex() === null) return "";
      return exportDeckAs("yld").replace("yld://", "");
    }
    //keep ?yld= in the address bar matching the deck (no new history entry), so a reload,
    //bookmark or going back to this entry never loses changes
    function syncDeckUrl() {
      try {
        const url = new URL(window.location.href);
        const code = deckUrlCode();
        if (code) url.searchParams.set("yld", code);
        else url.searchParams.delete("yld");
        url.searchParams.delete("d"); //a dlf2p.com deck would be loaded as well on reload
        if (url.href != window.location.href) history.replaceState(history.state, "", url);
        loadedUrlDeck = urlDeckKey();
      } catch (e) {
        console.error("Could not update the URL", e);
      }
    }
    //browser tab title: the deck's name once it has one
    function updateTitle() {
      const name = document.getElementById("deckName").value.trim();
      document.title = name && name != DEFAULT_DECK_NAME ? `${name} · ${PAGE_TITLE}` : PAGE_TITLE;
    }

    //=== saving in the browser: the deck, its name and skill, the format, sort and filters ===
    const STORAGE_KEY = "ygol.editor.v1";
    let saveTimer = null;
    function saveSoon() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 300);
    }
    function saveNow() {
      clearTimeout(saveTimer);
      if (!deckBuilder || !lastSnap) return; //not before the first load is done
      const name = document.getElementById("deckName").value;
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            v: 1,
            name,
            main: deckBuilder.cards.map((c) => c.name),
            side: deckBuilder.side.map((c) => c.name),
            skill: currentSkill,
            yld: deckUrlCode(), //to tell a reload of this deck from a link to another one
            format,
            sort,
            filters,
            freeFilterAutoOn,
          })
        );
      } catch (e) {
        //storage blocked or full: the page still works, it just won't remember
      }
      //the deck name of this history entry, for going back/forward (see pushDeckUrl)
      try {
        if (!history.state || history.state.deckName != name)
          history.replaceState(Object.assign({}, history.state, { deckName: name }), "");
      } catch (e) {}
    }
    window.addEventListener("pagehide", saveNow);
    function loadSaved() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        return data && data.v == 1 ? data : null;
      } catch (e) {
        return null;
      }
    }

    //=== deck name: Enter confirms, an empty name becomes "Untitled Deck" ===
    const deckNameInput = document.getElementById("deckName");
    deckNameInput.addEventListener("input", () => {
      const clean = cleanText(deckNameInput.value, 60);
      if (clean != deckNameInput.value) {
        const pos = deckNameInput.selectionStart;
        deckNameInput.value = clean;
        deckNameInput.setSelectionRange(pos, pos);
      }
      if (lastSnap) lastSnap.name = deckNameInput.value;
      updateTitle();
      saveSoon();
    });
    deckNameInput.addEventListener("blur", () => {
      deckNameInput.value = cleanText(deckNameInput.value, 60).trim() || DEFAULT_DECK_NAME;
      if (lastSnap) lastSnap.name = deckNameInput.value;
      updateTitle();
      saveSoon();
    });
    deckNameInput.addEventListener("keydown", (e) => {
      if (e.key == "Enter") deckNameInput.blur();
    });

    //=== "✓ N" on search results: copies already in the deck (main, extra and side) ===
    function refreshBadges() {
      for (const b of searchResult.querySelectorAll(".owned")) b.remove();
      if (!deckBuilder) return;
      const counts = new Map();
      for (const c of deckBuilder.cards.concat(deckBuilder.side))
        counts.set(c.name, (counts.get(c.name) || 0) + 1);
      if (!counts.size) return;
      for (const img of searchResult.querySelectorAll("img[data-key]")) {
        const n = counts.get(decodeURIComponent(img.dataset.key));
        if (!n) continue;
        const b = document.createElement("span");
        b.className = "owned";
        b.textContent = `✓ ${n}`;
        //bottom-right corner of the card (the CSS shifts it up and left by its own size)
        b.style.left = img.offsetLeft + img.offsetWidth + "px";
        b.style.top = img.offsetTop + img.offsetHeight + "px";
        searchResult.appendChild(b);
      }
    }
    window.addEventListener("resize", refreshBadges);

    //=== keyboard ===
    //Escape: close popups. Outside text boxes: Ctrl+Z undo, Ctrl+Y / Ctrl+Shift+Z redo
    //(Cmd on a Mac), "/" jumps to the card search, E switches View/Edit mode
    document.addEventListener("keydown", (e) => {
      if (e.key == "Escape") {
        closeExport();
        if (document.getElementById("popupCss1").style.display == "flex") closeInfoPopup();
        return;
      }
      const t = e.target;
      const typing = t && (t.tagName == "INPUT" || t.tagName == "TEXTAREA" || t.isContentEditable);
      if (typing || !deckBuilder) return;
      if (document.getElementById("exportLayer").classList.contains("open")) return;
      const mod = e.ctrlKey || e.metaKey;
      const k = e.key.toLowerCase();
      if (mod && !e.altKey && k == "z") {
        e.preventDefault();
        return e.shiftKey ? redo() : undo();
      }
      if (mod && !e.altKey && k == "y") {
        e.preventDefault();
        return redo();
      }
      if (mod || e.altKey) return;
      if (e.key == "/") {
        e.preventDefault();
        showScreen("search");
        const s = document.getElementById("searchInput");
        s.focus();
        s.select();
      } else if (k == "e" && !e.shiftKey) {
        e.preventDefault();
        switchMode();
      }
    });

    const params = new URL(document.location).searchParams;

    //load the card/skill/banlist data arrays, then initialise
    function addScript(name) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = name;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    async function loadData() {
      await Promise.all(
        [
          "data/ygolDb.js",
          "data/ygolID.js",
          "data/skillDb.js",
          "data/banlistDl.js",
          "data/banlistDlzg.js",
          "data/banlistMd.js",
          "data/banlistTcg.js",
          "data/banlistOcg.js",
        ].map(addScript)
      );
      ygolDeck = new YgolDeck(cardDb, ygolID, false);
      deckBuilder = new DeckBuilder(cardDb);
      deckBuilder.onRender = scheduleDeckChange;
      for (const c of cardDb) if (!cardByName.has(c.name)) cardByName.set(c.name, c);
      deckBuilder.addBanlist("dl", banlistDl);
      deckBuilder.addBanlist("dlzg", banlistDlzg);
      deckBuilder.addBanlist("md", banlistMd);
      deckBuilder.addBanlist("tcg", banlistTcg);
      deckBuilder.addBanlist("ocg", banlistOcg);
      deckBuilder.addBanlist("unlimited", []);
      deckBuilder.changeFormat(format);
      centerCardRows();
      const dlf2p = window.location.href.includes("dlf2p=true");
      //what was saved in this browser last time: sort, filters and format first
      const saved = loadSaved();
      if (saved) {
        if (typeof saved.sort == "string") sort = saved.sort;
        if (Array.isArray(saved.filters)) filters = saved.filters.filter((f) => typeof f == "string");
        freeFilterAutoOn = !!saved.freeFilterAutoOn && filters.includes(FREE_DL_FILTER);
        if (!dlf2p && FORMATS.includes(saved.format)) setFormat(saved.format);
      }
      //dlf2p.com special controls
      if (dlf2p) {
        document.getElementById("testhands").style.display = "none";
        format = "dl";
        deckBuilder.changeFormat("dl");
        document.getElementById("btnFormat").innerHTML = "Format: DL";
        updateSkillVisibility();
      }
      //the deck: a link with a different deck in it (?yld= or dlf2p.com's ?d=) loads that deck;
      //otherwise (no deck in the address, or a reload of the saved deck) the saved deck comes back
      const urlYld = params.get("yld");
      const urlD = dlf2p && params.get("d");
      const reloadOfSaved = saved && urlYld && !urlD && urlYld == saved.yld;
      if ((urlYld || urlD) && !reloadOfSaved) {
        loadDeckFromUrl();
      } else if (saved) {
        deckBuilder.cards = (saved.main || []).map((n) => cardByName.get(n)).filter(Boolean);
        deckBuilder.side = (saved.side || []).map((n) => cardByName.get(n)).filter(Boolean);
        if (saved.skill && skillDb.some((s) => s.name == saved.skill)) setSkill(saved.skill);
        document.getElementById("deckName").value =
          cleanText(saved.name || "", 60).trim() || DEFAULT_DECK_NAME;
      }
      deckBuilder.render(main, extra, cardwidth);
      updateTitle();
      runCardSearch();
    }
    loadData();
  </script>
  <script src="data/ygol-nav.js"></script>
</html>
