<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Deck builder for Duel Links, Master Duel, TCG or OCG in the browser. Includes a solo testing feature for test hands and practising combos."
    />
    <link rel="icon" type="image/x-icon" href="images/logo.png" />
    <title>DLF2P Editor</title>
    <style>
      /* ===== colour scheme "Indigo": every colour in this page is defined here ===== */
      :root {
        --page-bg: #07060c;
        --text: #dee0f7;
        --text-muted: #98a1ec; /* secondary text and placeholders */
        --frame-border: #8672cb; /* outline around the whole page */
        --panel-bg: #0e0b1e; /* boxes inside the frame */
        --panel-border: #8672cb;
        --input-bg: #2a2e54;
        --input-text: #dee0f7;
        --btn-bg: #2a2e54;
        --btn-border: #4a50be;
        --btn-text: #dee0f7;
        --highlight-bg: #4474c9; /* hovered/selected buttons (blues) */
        --highlight-border: #93e3fa; /* also used for focus outlines */
        --highlight-text: #cfeaff;
        --highlight-glow: #2f58c2cc;
        --popup-bg: #07060cf0; /* popups (semi-transparent) */
        --skill-text: #ffff77;
        --scroll-track: #0c0c24;
        --scroll-thumb: #34358f;
        --note-text: #93e3fa; /* notes in the copy/download format popup */
        --overlay-bg: #07060c99; /* dims the page behind the copy/download popup */
      }
      /* Barlow (SIL Open Font License, see fonts/OFL.txt), bundled so every system shows the same font */
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url("fonts/barlow-latin-300-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url("fonts/barlow-latin-ext-300-normal.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/barlow-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/barlow-latin-ext-400-normal.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("fonts/barlow-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("fonts/barlow-latin-ext-500-normal.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Barlow Semi Condensed";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/barlow-semi-condensed-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Barlow Semi Condensed";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/barlow-semi-condensed-latin-ext-400-normal.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        padding: 0;
        margin: 0;
      }
      :root {
        /* Barlow is bundled in fonts/; the rest are each system's closest match if it can't load */
        --font: "Barlow", "Bahnschrift", "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      }
      body {
        background-color: var(--page-bg);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font);
        font-weight: lighter;
        font-size: 1.7vw;
        color: var(--text);
      }
      #body {
        display: flex;
        border-width: max(0.14vw, 2px);
        border-color: var(--frame-border);
        border-style: solid;
      }
      #body > div {
        margin: 10px;
      }
      .purple {
        background-color: var(--panel-bg);
        border-width: max(0.28vw, 2px);
        border-color: var(--panel-border);
        border-style: solid;
      }
      p {
        margin-top: 2vh;
      }
      input {
        padding: 0.35vw;
        font-size: 1.74vw;
        font-family: var(--font);
        font-weight: lighter;
        color: var(--input-text);
        background-color: var(--input-bg);
        border: none;
        width: 21vw;
        margin-bottom: 1vh;
      }
      button {
        width: 13.9vw;
        height: 6.48vh;
        background-color: var(--btn-bg);
        font-family: var(--font);
        font-weight: lighter;
        font-size: 1.4vw;
        color: var(--btn-text);
        border-width: max(0.28vw, 2px);
        border-color: var(--btn-border);
        border-style: solid;
        cursor: pointer;
        padding: 0px;
        outline: none;
        margin-bottom: 1vh;
        /* fades both ways: lighting up on hover and dimming when the cursor leaves */
        transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease,
          box-shadow 0.25s ease;
      }
      /* hovered buttons, and selected filter/sort buttons, light up in blue */
      button:hover,
      button.selected {
        background-color: var(--highlight-bg);
        border-color: var(--highlight-border);
        color: var(--highlight-text);
        box-shadow: 0 0 max(0.7vw, 6px) var(--highlight-glow);
      }
      button:focus-visible {
        border-color: var(--highlight-border);
      }
      input::placeholder {
        color: var(--text-muted);
        opacity: 1;
      }
      input:focus {
        outline: max(0.14vw, 2px) solid var(--highlight-border);
        outline-offset: 0;
      }
      #main,
      #extra,
      #searchResult,
      #popup {
        scrollbar-color: var(--scroll-thumb) var(--scroll-track);
      }
      ::-webkit-scrollbar {
        width: max(0.6vw, 8px);
        height: max(0.6vw, 8px);
      }
      ::-webkit-scrollbar-track {
        background: var(--scroll-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
      }
      ::-webkit-scrollbar-corner {
        background: var(--scroll-track);
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
      .minibtn {
        width: 10.4vw;
        height: 5.2vh;
        font-size: 1vw;
        border-width: max(0.2vw, 2px);
      }
      .filterbtn {
        width: 6.9vw;
        height: 5.2vh;
        font-size: 1vw;
        border-width: max(0.2vw, 2px);
      }
      #main {
        margin-bottom: 1.3vh;
        padding: 0.7vw;
        width: 43.5vw;
        height: 50vh;
        overflow-y: scroll;
      }
      #extra {
        padding: 0.7vw;
        width: 43.5vw;
        height: 25vh;
        overflow-y: scroll;
      }
      #searchResult {
        width: 29vw;
        height: 50vh;
        overflow-y: scroll;
        margin-bottom: 1.3vh;
      }
      #popupCss1 {
        width: 100vw;
        height: 100vh;
        margin: 0px;
        padding: 0px;
        z-index: 9999;
        position: fixed;
        display: none;
        justify-content: center;
      }
      #popupCss2 {
        height: 100vh;
        margin: 0px;
        padding: 0px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #popup {
        width: 55.6vw;
        height: 80vh;
        overflow: scroll;
        background-color: var(--popup-bg);
        padding: 1.4vw;
        justify-content: center;
        font-size: 1vw;
        position: relative;
      }
      .cardname {
        font-size: 1.4vw;
        text-align: center;
      }
      .skilltext {
        color: var(--skill-text);
        cursor: pointer;
      }
      .filterheader {
        font-size: 1.7vw;
        margin-bottom: 0.7vw;
      }
      img {
        transition: filter 0.5s ease-out;
        user-select: none;
      }
      .white-out {
        filter: brightness(1000%);
      }
      /* set skill above the deck: click it to read the skill's text */
      #skillname:not(.set) {
        cursor: default;
      }
      .skill-desc {
        white-space: pre-line;
      }
      /* ===== copy/download format popup ===== */
      #exportLayer {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        justify-content: center;
        align-items: center;
        background-color: var(--overlay-bg);
      }
      #exportLayer.open {
        display: flex;
      }
      #exportBox {
        width: min(30vw, 92vw);
        max-height: 90vh;
        overflow-y: auto;
        padding: 1.2vw;
        background-color: var(--popup-bg);
        border: max(0.28vw, 2px) solid var(--panel-border);
        font-size: 1vw;
      }
      #exportTitle {
        margin: 0 0 0.8vw;
        font-size: 1.4vw;
      }
      #exportBox button.export-option {
        display: block;
        width: 100%;
        height: auto;
        margin: 0 0 0.6vw;
        padding: 0.6vw 0.8vw;
        text-align: left;
        font-size: 1.2vw;
      }
      #exportBox .export-desc {
        display: block;
        margin-top: 0.2vw;
        font-size: 0.9vw;
        color: var(--text-muted);
      }
      #exportBox button.export-option:hover .export-desc,
      #exportBox button.export-option.selected .export-desc {
        color: var(--highlight-text);
      }
      #exportBox .export-note {
        display: block;
        margin-top: 0.2vw;
        font-size: 0.9vw;
        color: var(--note-text);
      }
      #exportBox button.export-option:hover .export-note,
      #exportBox button.export-option.selected .export-note {
        color: var(--highlight-text);
      }
      #exportBox textarea {
        display: block;
        width: 100%;
        height: 10vw;
        margin: 0 0 0.6vw;
        padding: 0.5vw;
        box-sizing: border-box;
        resize: vertical;
        font-family: var(--font);
        font-size: 1vw;
        color: var(--input-text);
        background-color: var(--input-bg);
        border: none;
      }
      #exportBox textarea:focus {
        outline: max(0.14vw, 2px) solid var(--highlight-border);
      }
      #exportBox .export-hint {
        margin: 0 0 0.6vw;
        font-size: 0.9vw;
        color: var(--text-muted);
      }
      @media (max-aspect-ratio: 1/1) {
        #exportBox textarea {
          height: 35vw;
          font-size: 3.5vw;
          padding: 2vw;
        }
        #exportBox .export-hint {
          font-size: 3.3vw;
        }
        #exportBox {
          width: 92vw;
          padding: 4vw;
          font-size: 3.5vw;
        }
        #exportTitle {
          font-size: 4.5vw;
          margin-bottom: 3vw;
        }
        #exportBox button.export-option {
          font-size: 4.2vw;
          padding: 2.5vw 3vw;
          margin-bottom: 2.5vw;
        }
        #exportBox .export-desc,
        #exportBox .export-note {
          font-size: 3.3vw;
        }
      }
    </style>
  </head>
  <body>
    <div id="popupCss1">
      <div id="popupCss2">
        <div id="popup"></div>
      </div>
    </div>
    <div id="body">
      <div id="deck">
        <button id="btnFormat" class="minibtn" onclick="switchFormat()">
          Format: DL
        </button>
        <button class="minibtn" onclick="sortDeck()">Sort Deck</button>
        <button class="minibtn" id="btnControl" onclick="showControls()">
          Editor Menu
        </button>
        <button id="switchMainSide" class="minibtn" onclick="switchMainSide()">
          View Side Deck
        </button>
        <button id="switchMode" class="minibtn" onclick="switchMode()">
          Mode: View
        </button>
        <div class="cardname skilltext" id="skillname" onclick="showSkillInfo()">Skill Not Set</div>
        <div id="main" class="purple"></div>
        <div id="extra" class="purple"></div>
      </div>
      <div id="controls">
        <input
          id="deckName"
          value="Untitled Deck"
          type="text"
          placeholder="Deck name..."
          autocomplete="off"
        />
        <button class="filterbtn" id="switchModeDesktop" onclick="switchMode()">Mode: View</button>
        <button class="filterbtn" id="btnViewDeck" onclick="showControls()">
          View Deck</button
        ><br />
        <input
          id="searchInput"
          type="text"
          placeholder="Search card..."
          onkeyup="cardSearch()"
          autocomplete="off"
        />
        <button class="filterbtn" onclick="openFilter()">Options</button>
        <br />
        <input
          id="skillInput"
          type="text"
          placeholder="Search skill..."
          onkeyup="skillSearch()"
          autocomplete="off"
        />
        <button class="filterbtn" id="skillClear" onclick="setSkill(null)">Clear</button>
        <div id="searchResult" class="purple"></div>
        <button id="testhands" onclick="testHands()">Test Hands</button>
        <button id="copyDeck" onclick="openExport('copy')">Copy</button><br />
        <button id="upload" onclick="openUpload()">Upload</button>
        <button id="download" onclick="openExport('download')">Download</button>
        <input
          id="uploadInput"
          type="file"
          accept=".yld,.ydk,.txt"
          style="display: none"
          onchange="loadUploadedDeck(this)"
        />
      </div>
    </div>
    <div id="exportLayer" onclick="closeExport()">
      <div
        id="exportBox"
        tabindex="-1"
        role="dialog"
        aria-modal="true"
        aria-labelledby="exportTitle"
        onclick="event.stopPropagation()"
      >
        <p id="exportTitle">Copy deck as</p>
        <div id="exportOptions"></div>
      </div>
    </div>
  </body>
  <script>
    //=== YgolDeck: deck format conversion (yld / ydk / ydke / dlf2pV2) ===
    class YgolDeck {
      constructor(db, ygolID, isRush) {
        this.db = db;
        this.ygolID = ygolID;
        this.isRush = isRush;
        //cards skipped by the last convert() because they aren't in the database
        this.missing = [];
        //skill index (into skillDb) read by the last convert() from a yld code, or null
        this.skill = null;
      }
      hasCard(name) {
        if (!this.dbNames) this.dbNames = new Set(this.db.map((a) => a.name));
        return this.dbNames.has(name);
      }
      //skill: optional skill index (into skillDb), only stored by the yld format
      convert(d, format, skill = null) {
        this.missing = [];
        this.skill = null;
        switch (format) {
          case "yld":
            return this.namelist_to_yld(this.toNamelist(d), skill);
          case "ydk":
            return this.namelist_to_ydk(this.toNamelist(d));
          case "ydke":
            return this.ydk_to_ydke(this.namelist_to_ydk(this.toNamelist(d)));
          case "dlf2pV2":
            return this.namelist_to_dlf2pV2(this.toNamelist(d));
          case "namelist":
            return this.toNamelist(d);
        }
      }
      toNamelist(d) {
        if (d.includes("#main") || d.includes("#extra")) {
          return this.ydk_to_namelist(d);
        } else if (d.includes("ydke://")) {
          return this.ydk_to_namelist(this.ydke_to_ydk(d));
        } else if (d.includes("yld://")) {
          return this.yld_to_namelist(d);
        } else if (d.slice(0, 2) == "3_") {
          //dlf2pv3
        } else {
          return this.dlf2pV2_to_namelist(d);
        }
      }
      isEDMonster(name) {
        let card = this.db.filter((a) => a.name == name)[0];
        if (!card) return false;
        return (
          card.monsterType.includes("Fusion") ||
          card.monsterType.includes("Synchro") ||
          card.monsterType.includes("Xyz") ||
          card.monsterType.includes("XYZ") ||
          card.monsterType.includes("Link")
        );
      }
      ydk_to_ydke(ydk) {
        function Uint32Array_to_ydke(main, extra, side) {
          function passcodesToBase64(passcodes) {
            const bytes = new Uint8Array(passcodes.buffer);
            let binaryString = "";
            for (let i = 0; i < bytes.length; i++) {
              binaryString += String.fromCharCode(bytes[i]);
            }
            return btoa(binaryString);
          }
          return (
            "ydke://" +
            passcodesToBase64(main) +
            "!" +
            passcodesToBase64(extra) +
            "!" +
            passcodesToBase64(side) +
            "!"
          );
        }
        function stringsToUint32Array(stringsArray) {
          const uint32Array = new Uint32Array(stringsArray.length);
          for (let i = 0; i < stringsArray.length; i++)
            uint32Array[i] = parseInt(stringsArray[i], 10);
          return uint32Array;
        }
        let main = ydk
          .split("#main")[1]
          .split("#extra")[0]
          .split("\n")
          .filter((a) => a != "");
        let extra = ydk
          .split("#extra")[1]
          .split("!side")[0]
          .split("\n")
          .filter((a) => a != "");
        let side = ydk
          .split("!side")[1]
          .split("\n")
          .filter((a) => a != "");
        return Uint32Array_to_ydke(
          stringsToUint32Array(main),
          stringsToUint32Array(extra),
          stringsToUint32Array(side)
        );
      }
      ydke_to_ydk(ydke) {
        function ydke_to_Uint32Array(ydke) {
          function base64ToPasscodes(base64) {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
              bytes[i] = binaryString.charCodeAt(i);
            }
            return new Uint32Array(bytes.buffer);
          }
          const components = ydke.slice("ydke://".length).split("!");
          return {
            main: base64ToPasscodes(components[0]),
            extra: base64ToPasscodes(components[1]),
            side: base64ToPasscodes(components[2]),
          };
        }
        return JSON.stringify(ydke_to_Uint32Array(ydke))
          .replace('"main"', "#main")
          .replace('"extra"', "#extra")
          .replace('"side"', "!side")
          .replace(/{/g, "")
          .replace(/}/g, "")
          .replace(/:/g, ",")
          .split(",")
          .filter((a) => !a.includes('"'))
          .join("\n");
      }
      ydk_to_namelist(ydk) {
        let arr = ydk.split("\n").filter((a) => a != "");
        for (let i = 0; i < arr.length; i++) {
          if (arr[i][0] != "#" && arr[i][0] != "!") {
            if (isNaN(arr[i])) {
              console.log(ydk);
              return ydk;
            } else {
              console.log(arr[i]);
              let card = this.db.filter((a) => a.konamiID == Number(arr[i]));
              if (card.length) {
                arr[i] = card[0].name;
              } else {
                card = this.db.filter(
                  (a) =>
                    a.konamiID == Number(arr[i]) + 1 ||
                    a.konamiID == Number(arr[i]) - 1
                );
                if (!card.length) this.missing.push(`Unknown card (ID ${arr[i]})`);
                arr[i] = card.length ? card[0].name : "";
              }
            }
          }
        }
        return arr.filter((a) => a != "").join("\n");
      }
      namelist_to_ydk(namelist) {
        let arr = namelist.split("\n");
        for (let i = 0; i < arr.length; i++) {
          let card = this.db.filter(
            (a) => a.name == arr[i] && (this.isRush ? a.rush : !a.rush)
          );
          if (card.length) arr[i] = card[0].konamiID || arr[i];
        }
        if (!namelist.includes("!side")) arr.push("!side");
        return arr.join("\n");
      }
      //yld code: "1" + main + "c" + extra + "c" + side + "c" + skill index, in base 13, then base 64.
      //cards are 5-digit ygolID indexes, "a"/"b" repeat the previous card once/twice.
      //every section after main is optional, so older codes (no side deck, no skill) still decode.
      yld_to_namelist(yld) {
        let raw = this.base13Encode(this.base64Decode(yld.replace("yld://", ""))).slice(1);
        let sections = raw.split("c");
        if (sections.length > 4) throw new Error("Invalid yld deck code");
        const headers = ["#main", "#extra", "!side"];
        let d = "";
        let prev = 0;
        for (let s = 0; s < Math.min(sections.length, 3); s++) {
          d += headers[s] + "\n";
          let chunks =
            sections[s]
              .replace(/a/g, "xxxxx")
              .replace(/b/g, "xxxxxxxxxx")
              .match(/.{1,5}/g) || [];
          for (let el of chunks) {
            //a chunk that isn't a 5-digit id means the code itself is corrupted
            if (el != "xxxxx" && !/^\d{5}$/.test(el))
              throw new Error("Invalid yld deck code");
            let idx = el == "xxxxx" ? prev : Number(el);
            let name = this.ygolID[idx];
            if (name !== undefined && this.hasCard(name)) {
              d += name + "\n";
            } else {
              //skip cards that aren't in the database instead of failing
              this.missing.push(name !== undefined ? name : `Unknown card (ID ${idx})`);
            }
            if (el != "xxxxx") prev = Number(el);
          }
        }
        //4th section: the set skill
        if (sections.length == 4 && sections[3] !== "") {
          if (!/^\d+$/.test(sections[3])) throw new Error("Invalid yld deck code");
          this.skill = Number(sections[3]);
        }
        return d;
      }
      namelist_to_yld(namelist, skill = null) {
        let d = "1";
        let prev = "";
        for (let el of namelist.split("\n")) {
          if (el.includes("#extra") || el.includes("!side")) {
            d += "c";
          } else if (this.ygolID.indexOf(el) != -1) {
            let curr = ("0000" + this.ygolID.indexOf(el)).slice(-5);
            d += prev == curr ? "a" : curr;
            prev = curr;
            d = d.replace("aa", "b");
          }
        }
        //the skill goes after the side deck, so add any missing extra/side separators first
        if (Number.isInteger(skill) && skill >= 0) {
          for (let seps = (d.match(/c/g) || []).length; seps < 2; seps++) d += "c";
          d += "c" + skill;
        }
        return "yld://" + this.base64Encode(this.base13Decode(d));
      }
      dlf2pV2_to_namelist(dlf2pV2) {
        let c = dlf2pV2.split("_")[0] == "2" ? dlf2pV2.slice(2) : dlf2pV2;
        let split = decodeURIComponent(c).split("_");
        let arr = this.base13Encode(this.base63Decode(split[0]));
        if (arr[0] != "a") arr = "0" + arr;
        arr = arr
          .replace(/a/g, "00")
          .replace(/c/g, "bb")
          .replace(/b/g, "xxxxxxxxxx")
          .match(/.{1,10}/g);
        let d = [];
        let prev = null; //last decoded card, null if it was skipped
        for (let el of arr) {
          if (el != "xxxxxxxxxx") {
            let card = this.db.filter((a) => a.konamiID == Number(el))[0];
            prev = card ? card.name : null;
            if (!card) this.missing.push(`Unknown card (ID ${Number(el)})`);
          } else if (prev === null) {
            this.missing.push(this.missing.at(-1) || "Unknown card");
          }
          //skip cards that aren't in the database instead of failing
          if (prev !== null) d.push(prev);
        }
        let main = d.filter((a) => !this.isEDMonster(a));
        let extra = d.filter((a) => this.isEDMonster(a));
        if (split[3])
          for (let el of split[3].split("-")) {
            if (!this.hasCard(el)) {
              this.missing.push(el);
            } else if (this.isEDMonster(el)) {
              extra.push(el);
            } else {
              main.push(el);
            }
          }
        return `#main\n${main.join("\n")}\n#extra\n${extra.join("\n")}`;
      }
      namelist_to_dlf2pV2(namelist) {
        let darr = [];
        let special = [];
        let prev = "";
        for (let el of namelist.split("\n")) {
          if (el.includes("!side")) break;
          if (!el.includes("#main") && !el.includes("#extra")) {
            let card = this.db.filter((a) => a.name == el)[0];
            if (card.konamiID) {
              let id = ("000000000" + card.konamiID).slice(-10);
              darr.push(id == prev ? "b" : id);
              prev = id;
            } else {
              special.push(el);
            }
          }
        }
        return `${this.base63Encode(
          this.base13Decode(darr.join("").replace(/bb/g, "c").replace(/00/g, "a"))
        )}_-1_Deck${special.length ? `_${special.join("-")}` : ""}`;
      }
      base64Encode(str) {
        if (str == "-1") return "-1";
        let input = BigInt(str);
        let chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
        let result = "";
        while (input > 0n) {
          result = chars[input - (input / 64n) * 64n] + result;
          input = BigInt(input / 64n);
        }
        return result;
      }
      base64Decode(str) {
        if (str == "-1") return "-1";
        let result = 0n;
        let chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
        for (let i = str.length - 1; i >= 0; i--) {
          result +=
            BigInt(chars.indexOf(str[i])) * 64n ** BigInt(str.length - 1 - i);
        }
        return result;
      }
      base13Encode(str) {
        if (str == "-1") return "-1";
        let input = BigInt(str);
        let chars = "0123456789abc";
        let result = "";
        while (input > 0n) {
          result = chars[input - (input / 13n) * 13n] + result;
          input = BigInt(input / 13n);
        }
        return result;
      }
      base13Decode(str) {
        if (str == "-1") return "-1";
        let result = 0n;
        let chars = "0123456789abc";
        for (let i = str.length - 1; i >= 0; i--) {
          result +=
            BigInt(chars.indexOf(str[i])) * 13n ** BigInt(str.length - 1 - i);
        }
        return result;
      }
      base63Encode(str) {
        if (str == "-1") return "-1";
        let input = BigInt(str);
        let chars =
          "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-";
        let result = "";
        while (input > 0n) {
          result = chars[input - (input / 63n) * 63n] + result;
          input = BigInt(input / 63n);
        }
        return result;
      }
      base63Decode(str) {
        if (str == "-1") return "-1";
        let result = 0n;
        let chars =
          "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-";
        for (let i = str.length - 1; i >= 0; i--) {
          result +=
            BigInt(chars.indexOf(str[i])) * 63n ** BigInt(str.length - 1 - i);
        }
        return result;
      }
    }

    //=== DeckBuilder: deck state, card search/filters, rendering ===
    class DeckBuilder {
      constructor(ygolDb, name = "Untitiled Deck", cards = [], side = []) {
        this.ygolDb = ygolDb;
        this.name = name;
        this.cards = cards; //card objects from ygolID
        this.side = side;
        this.format = "tcg";
        this.banlists = [];
        this.editingDeck = "main";
        this.errorimage = this.url("images/errorimage.jpg");
      }
      url(url) {
        return url;
      }
      name_url(str) {
        let fileName = str.replace(/[^a-zA-Z0-9\s_\-\.\(\)%]/g, "");
        fileName = fileName.replace(/\s/g, "_");
        return fileName.substring(0, 255);
      }
      htmlEncode(str) {
        if (str.includes("!htm!")) {
          return str;
        } else {
          return "!htm!" + str.replace(/"/g, "{quot}");
        }
      }
      htmlDecode(str) {
        if (str.includes("!htm!")) {
          return str.replace("!htm!", "").replace(/{quot}/g, '"');
        } else {
          return str;
        }
      }
      renameDeck(name) {
        this.name = name;
      }
      changeFormat(format) {
        this.format = format;
      }
      addBanlist(format, arrBanlist) {
        this.banlists.push({ format: format, banlist: arrBanlist });
      }
      switchEditingDeck(mainDiv, extraDiv, width) {
        if (this.editingDeck == "main") {
          this.editingDeck = "side";
          this.appendSide(mainDiv, extraDiv, width);
          return `View Main Deck`;
        } else {
          this.editingDeck = "main";
          this.appendDeck(mainDiv, extraDiv, width);
          return `View Side Deck`;
        }
      }
      appendCards(arrNames, targetDiv, width, location) {
        let cardno = -1;
        for (let el of arrNames) {
          cardno++;
          let altSrc = this.errorimage;
          altSrc = el.altimg;
          //if (el.konamiID) altSrc = `https://images.ygoprodeck.com/images/cards/${Number(el.konamiID)}.jpg`;
          let noRarity = false;
          if (this.format == "dl" || this.format == "dlzg") {
            if (el.rarityDl) {
              targetDiv.insertAdjacentHTML(
                "beforeend",
                `<img src="images/dltag${el.rarityDl}.png" style="width:${
                  (width * 2) / 3
                }px;height:${width / 6}px;margin-left:${
                  width / 3
                }px;vertical-align: top;">`
              );
            } else {
              noRarity = true;
            }
          }
          if (this.format == "md") {
            if (el.rarityMd) {
              targetDiv.insertAdjacentHTML(
                "beforeend",
                `<img src="images/mdtag${el.rarityMd}.png" style="width:${
                  (width * 2) / 3
                }px;height:${width / 6}px;margin-left:${
                  width / 3
                }px;vertical-align: top;">`
              );
            } else {
              noRarity = true;
            }
          }
          targetDiv.insertAdjacentHTML(
            "beforeend",
            `<img src="${this.url(`images/cards/${this.name_url(el.name)}.jpg`)}" alt="${
              el.name
            }" cardno="${cardno}" location="${location}" style="width:${width}px;margin:${
              (this.format == "dl" ||
                this.format == "dlzg" ||
                this.format == "md") &&
              noRarity == false
                ? `${width / 6}px 0px 0px -${width}px`
                : "0px"
            }" onmousedown="cardClicked(\`${targetDiv.id}\`,\`${this.htmlEncode(
              el.name
            )}\`,this)" onmouseup="cardReleased(this)" onerror="if(this.src==\`${altSrc}\`){this.onerror=null; this.src=\`${
              this.errorimage
            }\`;}else{this.src=\`${altSrc}\`}" draggable="false">`
          );
          let banlistCard = this.banlists
            .filter((a) => a.format == this.format)[0]
            .banlist.filter((a) => a.name == el.name)[0];
          if (banlistCard) {
            targetDiv.insertAdjacentHTML(
              "beforeend",
              `<img src="images/${banlistCard.banStatus}.png" style="width:${
                width / 3
              }px;margin:-${(width * 35) / 24}px ${(width * 2) / 3}px ${
                (width * 9) / 8
              }px -${width}px ;">`
            );
          }
        }
      }
      appendDeck(mainDiv, extraDiv, width) {
        mainDiv.innerHTML = "";
        extraDiv.innerHTML = "";
        let main = this.cards.filter((a) => a.priorityDl < 2000000000);
        let extra = this.cards.filter((a) => a.priorityDl >= 2000000000);
        this.appendCards(main, mainDiv, width, "main");
        this.appendCards(extra, extraDiv, width, "extra");
      }
      appendSide(mainDiv, extraDiv, width) {
        mainDiv.innerHTML = "";
        extraDiv.innerHTML = "";
        this.appendCards(this.side, mainDiv, width, "side");
      }
      importNamelist(namelist, mainDiv, extraDiv, width) {
        for (let line of namelist.split("\n")) {
          if (line.includes("!side"))
            this.switchEditingDeck(mainDiv, extraDiv, width);
          if (
            !line.includes("#main") &&
            !line.includes("#extra") &&
            !line.includes("!side") &&
            line.length
          ) {
            this.addCard(line, mainDiv, extraDiv, width);
          }
        }
        if (this.editingDeck == "side")
          this.switchEditingDeck(mainDiv, extraDiv, width);
      }
      sortDeck(mainDiv, extraDiv, width, format = "dl") {
        if (this.editingDeck == "main") {
          this.cards.sort((a, b) =>
            format == "dl" || format == "dlzg"
              ? b.priorityDl - a.priorityDl
              : b.priorityMd - a.priorityMd
          );
          this.appendDeck(mainDiv, extraDiv, width);
        } else {
          this.side.sort((a, b) =>
            format == "dl" || format == "dlzg"
              ? b.priorityDl - a.priorityDl
              : b.priorityMd - a.priorityMd
          );
          this.appendSide(mainDiv, extraDiv, width);
        }
      }
      swapCards(cardno1, cardno2, location, mainDiv, extraDiv, width) {
        let main = this.cards.filter((a) => a.priorityDl < 2000000000);
        let extra = this.cards.filter((a) => a.priorityDl >= 2000000000);
        let side = this.side;
        if (location == "side") {
          let temp = side[cardno1];
          side.splice(cardno1, 1);
          side.splice(cardno2, 0, temp);
          this.side = side;
          mainDiv.innerHTML = "";
          extraDiv.innerHTML = "";
          this.appendCards(side, mainDiv, width, "side");
        } else {
          if (location == "main") {
            let temp = main[cardno1];
            main.splice(cardno1, 1);
            main.splice(cardno2, 0, temp);
          }
          if (location == "extra") {
            let temp = extra[cardno1];
            extra.splice(cardno1, 1);
            extra.splice(cardno2, 0, temp);
          }
          this.cards = main.concat(extra);
          mainDiv.innerHTML = "";
          extraDiv.innerHTML = "";
          this.appendCards(main, mainDiv, width, "main");
          this.appendCards(extra, extraDiv, width, "extra");
        }
      }
      displayCard(name, targetDiv, width) {
        let cardObj = this.ygolDb.filter((a) => a.name == this.htmlDecode(name))[0];
        let altSrc = this.errorimage;
        altSrc = cardObj.altimg;
        //if (cardObj.konamiID) altSrc = `https://images.ygoprodeck.com/images/cards/${Number(cardObj.konamiID)}.jpg`;
        targetDiv.innerHTML = "";
        targetDiv.insertAdjacentHTML(
          "beforeend",
          `<div style="display: flex; justify-content: center">
            <img src="${this.url(
              `images/cards/${this.name_url(name)}.jpg`
            )}" alt="${name}" style="width:${width}px;" onerror="if(this.src==\`${altSrc}\`){this.onerror=null; this.src=\`${
            this.errorimage
          }\`;}else{this.src=\`${altSrc}\`}" >
          </div>
          <p class="cardname">${cardObj.name}</p>
          <p>${cardObj.description}</p>`
        );
      }
      searchCard(name, targetDiv, width, criterias = [], sort = "", limit = 300) {
        targetDiv.innerHTML = "";
        let filtered = this.ygolDb.filter((a) => {
          let n = a.name.toLowerCase();
          let d = a.description.toLowerCase();
          return n.includes(name.toLowerCase()) || d.includes(name.toLowerCase());
        });
        //apply filters
        let showall = false;
        for (let term of criterias) {
          if (term.includes("Monster")) {
            filtered = filtered.filter((a) => a.type == "Monster");
            if (term != "Monster") {
              let monsterType = term.replace(" Monster", "");
              if (monsterType == "Main Deck") {
                filtered = filtered.filter(
                  (a) =>
                    !(
                      a.monsterType.includes("Fusion") ||
                      a.monsterType.includes("Synchro") ||
                      a.monsterType.includes("Xyz") ||
                      a.monsterType.includes("Link")
                    )
                );
              } else if (monsterType == "Extra Deck") {
                filtered = filtered.filter(
                  (a) =>
                    a.monsterType.includes("Fusion") ||
                    a.monsterType.includes("Synchro") ||
                    a.monsterType.includes("Xyz") ||
                    a.monsterType.includes("Link")
                );
              } else if (monsterType == "Non-Effect") {
                filtered = filtered.filter(
                  (a) => !a.monsterType.includes("Effect")
                );
              } else {
                filtered = filtered.filter((a) =>
                  a.monsterType.includes(monsterType)
                );
              }
            }
          } else if (term.includes("Spell") && !term.includes("caster")) {
            filtered = filtered.filter((a) => a.type == "Spell");
            if (term != "Spell") {
              let spellType = term.replace(" Spell", "");
              filtered = filtered.filter((a) => (a.race || "").includes(spellType));
            }
          } else if (term.includes("Trap")) {
            filtered = filtered.filter((a) => a.type == "Trap");
            if (term != "Trap") {
              let trapType = term.replace(" Trap", "");
              filtered = filtered.filter((a) => (a.race || "").includes(trapType));
            }
          } else if (term.includes("Level/Rank")) {
            let levelrank = term.replace("Level/Rank ", "");
            filtered = filtered.filter((a) => a.level == levelrank);
          } else if (term.includes("Link")) {
            let link = term.replace("Link ", "");
            filtered = filtered.filter((a) => a.linkRating == link);
          } else if (term.includes("(DL)")) {
            if (term.includes("Free")) {
              filtered = filtered.filter((a) => a.zeroGem);
            } else if (term.includes("Released")) {
              if (term.includes("Not")) {
                filtered = filtered.filter((a) => !a.rarityDl);
              } else {
                filtered = filtered.filter((a) => a.rarityDl);
              }
            } else {
              filtered = filtered.filter(
                (a) => a.rarityDl == term.replace(" (DL)", "")
              );
            }
          } else if (term.includes("(MD)")) {
            if (term.includes("Released")) {
              if (term.includes("Not")) {
                filtered = filtered.filter((a) => !a.rarityMd);
              } else {
                filtered = filtered.filter((a) => a.rarityMd);
              }
            } else {
              filtered = filtered.filter(
                (a) => a.rarityMd == term.replace(" (MD)", "")
              );
            }
          } else if (term == "Handtrap") {
            filtered = filtered.filter((a) => a.handtrap);
          } else if (term == "Floodgate") {
            filtered = filtered.filter((a) => a.floodgate);
          } else if (term == "Show Rush") {
            filtered = filtered.filter((a) => a.rush);
            showall = true;
          } else if (term == "Show All") {
            showall = true;
          } else if (term.toUpperCase() == term) {
            filtered = filtered.filter((a) => a.attribute == term);
          } else {
            filtered = filtered.filter((a) => a.race == term);
          }
        }
        if (!showall) filtered = filtered.filter((a) => !a.rush);
        if (sort == "Popularity") {
          if (format == "dl" || format == "dlzg")
            filtered.sort((a, b) => a.popularityDl - b.popularityDl);
          if (format == "md")
            filtered.sort((a, b) => a.popularityMd - b.popularityMd);
          if (format == "tcg")
            filtered.sort((a, b) => a.popularityTcg - b.popularityTcg);
          if (format == "ocg")
            filtered.sort((a, b) => a.popularityOcg - b.popularityOcg);
        } else if (sort == "Rarity") {
          const rarityOrder = ["UR", "SR", "R", "N"];
          if (format == "dl" || format == "dlzg")
            filtered.sort((a, b) => {
              if (!a.rarityDl && b.rarityDl) return 1;
              if (a.rarityDl && !b.rarityDl) return -1;
              return (
                rarityOrder.indexOf(a.rarityDl) - rarityOrder.indexOf(b.rarityDl)
              );
            });
          if (format == "md")
            filtered.sort((a, b) => {
              if (!a.rarityMd && b.rarityMd) return 1;
              if (a.rarityMd && !b.rarityMd) return -1;
              return (
                rarityOrder.indexOf(a.rarityMd) - rarityOrder.indexOf(b.rarityMd)
              );
            });
        } else {
          filtered.sort((a, b) => a.name.localeCompare(b.name));
        }
        if (filtered.length > limit) filtered.length = limit;
        this.appendCards(filtered, targetDiv, width, "search");
      }
      addCard(name, mainDiv, extraDiv, width) {
        if (!this.ygolDb.some((a) => a.name == this.htmlDecode(name))) return;
        if (
          this.cards.filter((a) => a.name == this.htmlDecode(name)).length +
            this.side.filter((a) => a.name == this.htmlDecode(name)).length <
            3 ||
          window.location.href.includes("UNLIMITED_MODE=ON")
        ) {
          if (this.editingDeck == "main") {
            this.cards.push(
              this.ygolDb.filter((a) => a.name == this.htmlDecode(name))[0]
            );
            this.appendDeck(mainDiv, extraDiv, width);
          } else {
            this.side.push(
              this.ygolDb.filter((a) => a.name == this.htmlDecode(name))[0]
            );
            this.appendSide(mainDiv, extraDiv, width);
          }
        }
      }
      removeCard(cardno1, location, mainDiv, extraDiv, width) {
        let main = this.cards.filter((a) => a.priorityDl < 2000000000);
        let extra = this.cards.filter((a) => a.priorityDl >= 2000000000);
        let side = this.side;
        if (location == "side") {
          side.splice(cardno1, 1);
          this.side = side;
          mainDiv.innerHTML = "";
          extraDiv.innerHTML = "";
          this.appendCards(side, mainDiv, width, "side");
        } else {
          if (location == "main") {
            main.splice(cardno1, 1);
          }
          if (location == "extra") {
            extra.splice(cardno1, 1);
          }
          this.cards = main.concat(extra);
          mainDiv.innerHTML = "";
          extraDiv.innerHTML = "";
          this.appendCards(main, mainDiv, width, "main");
          this.appendCards(extra, extraDiv, width, "extra");
        }
      }
      exportNamelist() {
        let main = "#main\n";
        let extra = "#extra\n";
        let side = "!side\n";
        for (let el of this.cards) {
          if (el.priorityDl < 2000000000) {
            main += el.name + "\n";
          } else {
            extra += el.name + "\n";
          }
        }
        for (let el of this.side) {
          side += el.name + "\n";
        }
        return main + extra + side;
      }
    }

  <script>
    //=== Editor page ===
    //1438 772
    //hold click to view card
    let cardwidth = window.innerWidth * 0.043; //65px when vw is 14141px

    let format = "dl"; //format when the page is first opened
    let currentCard = "";
    let currentCardEl = null;
    let cardDivId = "";
    let mousedown = false;
    let mousehold = false;
    let mousemove = false;
    let mousemovemode = false;
    let clicksInHoldThreshold = 0;
    let mouseMoveTimeout;
    let poppingup = false;
    let selectingFilters = false;
    let filters = [];
    //the "Free (DL)" filter is switched on automatically in the DLZG format;
    //true only while it's on because of that (not because the user picked it)
    const FREE_DL_FILTER = "Free (DL)";
    let freeFilterAutoOn = false;
    let sort = "Popularity";
    let holdThreshold = 500;
    let _isMobile = window.innerHeight > window.innerWidth;
    let editMode = "view"; //view: a short click shows card info; edit: it adds/removes the card
    //skill name and skill search only show in the Duel Links formats
    function updateSkillVisibility() {
      const dl = format.includes("dl");
      document.getElementById("skillname").style.display = dl ? "block" : "none";
      //inline, so the Clear button sits next to the box like Options next to the card search
      document.getElementById("skillInput").style.display = dl ? "" : "none";
      document.getElementById("skillClear").style.display = dl ? "" : "none";
    }
    updateSkillVisibility();

    //mobile view
    if (_isMobile) {
      editMode = "view";
      cardwidth = window.innerWidth / 8;
      document.head.insertAdjacentHTML(
        "beforeend",
        `<style>
          *{font-weight: 500;}
          #deck{width: 90vw;}
          #main{width: 80vw; height: 50vh;}
          #extra{width: 80vw; height: 20vh;}
          input{width: 55vw; height: 5.5vw; font-size: 3.8vw;}
          .minibtn{width: 30vw; height: 7vw; font-size: 3.2vw;}
          .filterbtn{width: 20vw; height: 7vw; font-size: 2.7vw;}
          button{width: 40vw; height: 8vw; font-size: 4vw; font-weight: 500;}
          #popup{font-size: 3.5vw;}
          .cardname{font-size: 4.2vw;}
          .skilltext {font-size: 4.2vw;}
          #controls{display: none;}
          #searchResult{width: 80vw; height: 62vh;}
          #popup{width: 95vw;}
          .filterheader {font-size: 4.2vw;}
        </style>`
      );
      for (let el of document.querySelectorAll("button")) {
        if (el.classList.contains("minibtn")) {
          el.style.width = "27vw";
        }
      }
      document.getElementById("controls").style.display = "none";
      //phones use the mode toggle above the deck
      document.getElementById("switchModeDesktop").style.display = "none";
    } else {
      document.getElementById("btnControl").style.display = "none";
      document.getElementById("btnViewDeck").style.display = "none";
      //desktop uses the mode toggle next to the deck name
      document.getElementById("switchMode").style.display = "none";
    }

    function showControls() {
      if (document.getElementById("controls").style.display == "none") {
        document.getElementById("controls").style.display = "block";
        document.getElementById("deck").style.display = "none";
      } else {
        document.getElementById("controls").style.display = "none";
        document.getElementById("deck").style.display = "block";
      }
    }

    //cards can be dragged in either mode; only a short click differs
    function switchMode() {
      editMode = editMode == "view" ? "edit" : "view";
      const label = editMode == "view" ? "Mode: View" : "Mode: Edit";
      for (const id of ["switchMode", "switchModeDesktop"])
        document.getElementById(id).textContent = label;
    }

    document.addEventListener("mousedown", (event) => {
      mousedown = true;
      clicksInHoldThreshold += 1;
      setTimeout(() => {
        if (mousedown && clicksInHoldThreshold == 1 && !mousemove)
          mousehold = true;
        clicksInHoldThreshold -= 1;
      }, holdThreshold);
    });
    document.addEventListener("mouseup", (event) => {
      if (currentCardEl) {
        currentCardEl.style.position = "static";
        currentCardEl.style.pointerEvents = "auto";
        currentCardEl.style.left = "0px";
        currentCardEl.style.top = "0px";
      }
      if (
        !mousehold &&
        !mousemove &&
        (cardDivId == "main" ||
          cardDivId == "extra" ||
          cardDivId == "searchResult")
      ) {
        if (editMode == "edit") {
          if (cardDivId == "searchResult") {
            deckBuilder.addCard(currentCard, main, extra, cardwidth);
            for (let el of document.querySelectorAll("img")) {
              if (el.alt == currentCard) {
                el.classList.add("white-out");
                setTimeout(() => {
                  el.classList.remove("white-out");
                }, 100);
              }
            }
          } else if (!mousemovemode) {
            deckBuilder.removeCard(
              currentCardEl.getAttribute("cardno"),
              currentCardEl.getAttribute("location"),
              main,
              extra,
              cardwidth
            );
          }
        } else {
          document.getElementById("popupCss1").style.display = "flex";
          deckBuilder.displayCard(
            currentCard,
            document.getElementById("popup"),
            //phones: a third of the screen; desktop: the same size as the click-and-hold popup
            _isMobile ? window.innerWidth / 3 : 160
          );
        }
      }
      if (poppingup)
        document.getElementById("popupCss1").style.display = "none";
      mousedown = false;
      mousemovemode = false;
      mousehold = false;
      poppingup = false;
      currentCard = "";
      cardDivId = "";
    });
    document.addEventListener("mousemove", (event) => {
      mousemove = true;
      if (mousedown) mousemovemode = true;
      clearTimeout(mouseMoveTimeout);
      mouseMoveTimeout = setTimeout(() => {
        mousemove = false;
      }, 100);
      if (currentCardEl && mousedown) {
        currentCardEl.style.position = "absolute";
        currentCardEl.style.pointerEvents = "none";
        //centre the card on the cursor; subtract its margins, because in formats with a
        //rarity tag the card is pulled under the tag with a negative left margin
        const cardStyle = getComputedStyle(currentCardEl);
        currentCardEl.style.left =
          event.pageX - currentCardEl.width / 2 - parseFloat(cardStyle.marginLeft) + "px";
        currentCardEl.style.top =
          event.pageY - currentCardEl.height / 2 - parseFloat(cardStyle.marginTop) + "px";
      }
    });
    document
      .getElementById("popupCss1")
      .addEventListener("mouseup", (event) => {
        if (!selectingFilters) {
          document.getElementById("popupCss1").style.display = "none";
          let input = document.getElementById("searchInput").value;
          const wasSkillPopup = popupKind == "skill";
          popupKind = "card";
          if (!wasSkillPopup && (input.length > 2 || filters.length)) {
            deckBuilder.searchCard(
              input,
              searchResult,
              cardwidth,
              filters,
              sort
            );
          }
        }
        selectingFilters = false;
      });
    setInterval(() => {
      if (mousehold && currentCard && !poppingup) {
        poppingup = true;
        document.getElementById("popupCss1").style.display = "flex";
        deckBuilder.displayCard(
          currentCard,
          document.getElementById("popup"),
          160
        );
      }
    }, 100);
    //a filter/sort button's label without the whitespace from its HTML layout
    function filterLabel(html) {
      return html.replace(/\s+/g, " ").trim();
    }
    function updateFilterDisplay() {
      for (let el of document
        .getElementById("popup")
        .querySelectorAll("button")) {
        //selected = the current sort or an active filter; styled by button.selected in the css
        const label = filterLabel(el.innerHTML);
        el.classList.toggle("selected", label == sort || filters.includes(label));
      }
    }

    function cardClicked(divid, cardname, el) {
      currentCard = cardname;
      currentCardEl = el;
      cardDivId = divid;
    }
    function cardReleased(el) {
      if (
        currentCardEl.getAttribute("location") == el.getAttribute("location") &&
        el.getAttribute("location") != "search"
      ) {
        deckBuilder.swapCards(
          currentCardEl.getAttribute("cardno"),
          el.getAttribute("cardno"),
          el.getAttribute("location"),
          main,
          extra,
          cardwidth
        );
      }
    }
    function cardSearch() {
      let input = document.getElementById("searchInput").value;
      setTimeout(() => {
        if (
          (input.length > 2 || filters.length) &&
          input == document.getElementById("searchInput").value
        ) {
          deckBuilder.searchCard(input, searchResult, cardwidth, filters, sort);
        }
      }, 500);
    }
    function skillSearch() {
      let input = document.getElementById("skillInput").value;
      setTimeout(() => {
        if (
          (input.length > 2 || filters.length) &&
          input == document.getElementById("skillInput").value
        ) {
          let results = skillDb.filter(
            (a) =>
              a.name.toLowerCase().includes(input.toLowerCase()) ||
              a.description.toLowerCase().includes(input.toLowerCase())
          );
          searchResult.innerHTML = "";
          for (let item of results) {
            if (format != "dlzg" || banlistDlzgSkill.indexOf(item.name) == -1) {
              //built as an element (not an onclick string) so names with ' " & work
              const el = document.createElement("div");
              el.className = "skilltext";
              el.textContent = `✦ ${item.name}`;
              el.addEventListener("click", () => selectSkill(item.name));
              searchResult.appendChild(el);
            }
          }
        }
      }, 500);
    }
    //the deck's set skill (a skillDb name), or null; shown in #skillname
    let currentSkill = null;
    function setSkill(name) {
      currentSkill = name || null;
      const el = document.getElementById("skillname");
      el.textContent = currentSkill ? `✦ ${currentSkill}` : "Skill Not Set";
      el.classList.toggle("set", !!currentSkill);
    }
    //clicking the set skill shows its text in the same popup as card info
    let popupKind = "card";
    function showSkillInfo() {
      if (!currentSkill) return;
      const skill = skillDb.find((a) => a.name == currentSkill);
      if (!skill) return;
      const popup = document.getElementById("popup");
      popup.innerHTML = "";
      const name = document.createElement("p");
      name.className = "cardname skilltext";
      name.textContent = `✦ ${skill.name}`;
      const desc = document.createElement("p");
      desc.className = "skill-desc";
      desc.textContent = skill.description;
      popup.append(name, desc);
      popup.scrollTop = 0;
      popupKind = "skill";
      document.getElementById("popupCss1").style.display = "flex";
    }
    function selectSkill(name) {
      setSkill(name);
    }
    //index of the set skill in skillDb, or null if no skill is set
    function currentSkillIndex() {
      if (!currentSkill) return null;
      const i = skillDb.findIndex((a) => a.name == currentSkill);
      return i == -1 ? null : i;
    }
    //apply the skill read from a yld code (index or null); returns false if it isn't in skillDb
    let missingSkill = null;
    function applyDecodedSkill(index) {
      missingSkill = null;
      if (index === null) {
        setSkill(null);
        return true;
      }
      if (skillDb[index]) {
        setSkill(skillDb[index].name);
        return true;
      }
      missingSkill = index;
      setSkill(null);
      return false;
    }
    function openFilter() {
      document.getElementById("popup").innerHTML = editorFilters;
      document.getElementById("popupCss1").style.display = "flex";
      updateFilterDisplay();
    }
    function selectFilter(innerHTMLWithSpaces) {
      let innerHTML = filterLabel(innerHTMLWithSpaces);
      selectingFilters = true;
      //once the user toggles it, the filter is theirs: leaving DLZG won't switch it off
      if (innerHTML == FREE_DL_FILTER) freeFilterAutoOn = false;
      if (filters.includes(innerHTML)) {
        filters = filters.filter((a) => a != innerHTML);
      } else {
        filters.push(innerHTML);
      }
      updateFilterDisplay();
    }
    function clearFilters() {
      selectingFilters = true;
      filters.length = 0;
      freeFilterAutoOn = false;
      updateFilterDisplay();
    }
    function selectSort(innerHTMLWithSpaces) {
      selectingFilters = true;
      sort = filterLabel(innerHTMLWithSpaces);
      updateFilterDisplay();
    }
    function switchMainSide() {
      document.getElementById("switchMainSide").innerHTML =
        deckBuilder.switchEditingDeck(main, extra, cardwidth);
    }
    const FORMATS = ["dl", "dlzg", "md", "tcg", "ocg", "unlimited"];
    //the format button: move to the next format
    function switchFormat() {
      setFormat(FORMATS[(FORMATS.indexOf(format) + 1) % FORMATS.length]);
    }
    //switch straight to a format (also used after uploading a deck)
    function setFormat(newFormat) {
      if (!FORMATS.includes(newFormat)) return;
      format = newFormat;
      document.getElementById(
        "btnFormat"
      ).innerHTML = `Format: ${format.toUpperCase()}`;
      deckBuilder.changeFormat(format);
      let freeFilterAutoRemoved = false;
      if (format == "dlzg") {
        //switch "Free (DL)" on, unless the user already has it on
        if (!filters.includes(FREE_DL_FILTER)) {
          filters.push(FREE_DL_FILTER);
          freeFilterAutoOn = true;
        }
      } else if (freeFilterAutoOn) {
        //leaving DLZG: undo only what switching to DLZG did
        filters = filters.filter((a) => a != FREE_DL_FILTER);
        freeFilterAutoOn = false;
        freeFilterAutoRemoved = true;
      }
      updateSkillVisibility();
      if (deckBuilder.editingDeck == "main") {
        deckBuilder.appendDeck(main, extra, cardwidth);
      } else {
        deckBuilder.appendSide(main, extra, cardwidth);
      }
      let input = document.getElementById("searchInput").value;
      if (input.length > 2 || filters.length) {
        deckBuilder.searchCard(input, searchResult, cardwidth, filters, sort);
      } else if (
        format.includes("dl") &&
        document.getElementById("skillInput").value.length > 2
      ) {
        skillSearch();
      } else if (freeFilterAutoRemoved) {
        //the results were only showing because of the automatic filter
        searchResult.innerHTML = "";
      }
    }
    function sortDeck() {
      deckBuilder.sortDeck(main, extra, cardwidth, format);

    function testHands() {
      if (!document.getElementById("deckName").value)
        document.getElementById("deckName").value = "Untitled Deck";
      let namelist = deckBuilder.exportNamelist();
      //cards only: test-hands.html has its own yld decoder, which doesn't read skills
      let yld = ygolDeck.namelist_to_yld(namelist).replace("yld://", "");
      window.open(`test-hands.html?yld=${yld}`);
    }
    //=== copy/download: pick a deck code format first ===
    const EXPORT_FORMATS = [
      { id: "yld", label: "YLD", ext: ".yld", desc: "YGO Lightning deck code. Keeps the side deck and the skill." },
      { id: "ydke", label: "YDKE", ext: ".txt", desc: "Deck code for YGOPro-based simulators." },
      { id: "ydk", label: "YDK", ext: ".ydk", desc: "Deck file for YGOPro-based simulators." },
      { id: "namelist", label: "Card names", ext: ".txt", desc: "One card name per line, in sections." },
    ];
    //the small popup used by Copy, Download and Upload: a title and a list of choices.
    //choices: [{ label, desc (optional), notes, onSelect }]; highlight: label of the option to highlight, or null
    function openChoicePopup(title, choices, highlight = null) {
      document.getElementById("exportTitle").textContent = title;
      const options = document.getElementById("exportOptions");
      options.innerHTML = "";
      for (const c of choices) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "export-option" + (c.label == highlight ? " selected" : "");
        btn.innerHTML = `${c.label}${c.desc ? `<span class="export-desc">${c.desc}</span>` : ""}${(c.notes || [])
          .map((n) => `<span class="export-note">${n}</span>`)
          .join("")}`;
        btn.addEventListener("click", () => {
          closeExport();
          c.onSelect();
        });
        options.appendChild(btn);
      }
      document.getElementById("exportLayer").classList.add("open");
      //focus the highlighted option, or the popup itself when nothing is highlighted
      (options.querySelector(".selected") || document.getElementById("exportBox")).focus();
    }
    function openExport(action) {
      const deck = deckBuilder.exportNamelist();
      const noId = cardsWithoutKonamiID(deck).length;
      const choices = EXPORT_FORMATS.map((f) => {
        //what this format would leave out of the current deck
        const notes = [];
        if ((f.id == "ydk" || f.id == "ydke") && noId)
          notes.push(`${noId} ${noId == 1 ? "card has" : "cards have"} no Konami ID and will be left out.`);
        if (f.id != "yld" && currentSkill) notes.push("The skill won't be saved.");
        return {
          label: f.label,
          desc: f.desc,
          notes,
          onSelect: () => (action == "copy" ? copyDeckAs(f) : downloadDeckAs(f)),
        };
      });
      //YLD is always highlighted
      openChoicePopup(action == "copy" ? "Copy deck as" : "Download deck as", choices, "YLD");
    }
    //=== upload: from a file or from the clipboard (nothing highlighted) ===
    function openUpload() {
      openChoicePopup("Upload deck from", [
        {
          label: "File",
          onSelect: () => document.getElementById("uploadInput").click(),
        },
        {
          label: "Clipboard",
          onSelect: uploadFromClipboard,
        },
      ]);
    }
    async function uploadFromClipboard() {
      let text = null;
      try {
        text = await navigator.clipboard.readText();
      } catch (e) {
        //the browser blocked reading the clipboard (not https, or permission refused)
      }
      if (text === null) return openPasteBox();
      if (!text.trim()) return alert("The clipboard is empty.");
      loadDeckText(text, null, "clipboard");
    }
    //fallback when the clipboard can't be read directly: paste into a box instead
    function openPasteBox() {
      document.getElementById("exportTitle").textContent = "Paste deck";
      const options = document.getElementById("exportOptions");
      options.innerHTML = "";
      const hint = document.createElement("p");
      hint.className = "export-hint";
      hint.textContent = "Your browser didn't allow reading the clipboard. Paste the deck here (Ctrl+V), then press Load.";
      const box = document.createElement("textarea");
      box.setAttribute("aria-label", "Deck code or card list");
      const load = document.createElement("button");
      load.type = "button";
      load.className = "export-option";
      load.textContent = "Load";
      load.addEventListener("click", () => {
        if (!box.value.trim()) return box.focus();
        closeExport();
        loadDeckText(box.value, null, "clipboard");
      });
      options.append(hint, box, load);
      document.getElementById("exportLayer").classList.add("open");
      box.focus();
    }
    function closeExport() {
      document.getElementById("exportLayer").classList.remove("open");
    }
    document.addEventListener("keydown", (e) => {
      if (e.key == "Escape") closeExport();
    });
    //names (with repeats) of the deck's cards that have no Konami ID (can't go in ydk/ydke)
    function cardsWithoutKonamiID(namelist) {
      return namelist
        .split("\n")
        .filter((a) => a && a != "#main" && a != "#extra" && a != "!side")
        .filter((name) => !(cardDb.find((c) => c.name == name) || {}).konamiID);
    }
    //the current deck as a code/file in the chosen format
    function exportDeckAs(formatId) {
      let namelist = deckBuilder.exportNamelist();
      if (formatId == "ydk" || formatId == "ydke") {
        //cards without a Konami ID would break these formats, so they're left out
        const skip = new Set(cardsWithoutKonamiID(namelist));
        namelist = namelist
          .split("\n")
          .filter((a) => !skip.has(a))
          .join("\n");
      }
      return ygolDeck.convert(namelist, formatId, formatId == "yld" ? currentSkillIndex() : null);
    }
    async function copyDeckAs(f) {
      const text = exportDeckAs(f.id);
      let ok = false;
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (e) {
        //older browsers / non-https pages: copy through a hidden textarea
        const input = document.createElement("textarea");
        input.value = text;
        document.body.appendChild(input);
        input.select();
        ok = document.execCommand("copy");
        document.body.removeChild(input);
      }
      const btn = document.getElementById("copyDeck");
      btn.textContent = ok ? `Copied ${f.label}!` : "Copy failed";
      setTimeout(() => (btn.textContent = "Copy"), 2000);
    }
    function downloadDeckAs(f) {
      if (!document.getElementById("deckName").value)
        document.getElementById("deckName").value = "Untitled Deck";
      let name = document.getElementById("deckName").value;
      let text = exportDeckAs(f.id);
      //strip characters that aren't allowed in file names
      let fileName =
        name.replace(/[\\/:*?"<>|]/g, "").trim() || "Untitled Deck";
      const blob = new Blob([text], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName + f.ext;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    //tell the user which cards were skipped by the last ygolDeck.convert()
    function reportMissingCards() {
      let parts = [];
      if (ygolDeck.missing.length) {
        let counts = {};
        for (let name of ygolDeck.missing) counts[name] = (counts[name] || 0) + 1;
        let lines = Object.entries(counts).map(
          ([name, n]) => `- ${name}${n > 1 ? ` x${n}` : ""}`
        );
        if (lines.length > 20)
          lines = lines.slice(0, 20).concat(`...and ${lines.length - 20} more`);
        parts.push(
          `${ygolDeck.missing.length} card(s) in this deck are not in the card database and were skipped:\n${lines.join("\n")}`
        );
      }
      if (missingSkill !== null)
        parts.push(`The deck's skill (ID ${missingSkill}) is not in the skill database, so no skill was set.`);
      if (parts.length) alert(parts.join("\n\n"));
    }

    //which deck format a piece of text is (same rules as YgolDeck.toNamelist)
    function detectDeckFormat(text) {
      if (text.includes("#main") || text.includes("#extra")) return "ydk/namelist";
      if (text.includes("ydke://")) return "ydke";
      if (text.includes("yld://")) return "yld";
      return "dlf2pV2";
    }
    //upload accepts every format the converter reads: yld, ydk, ydke, dlf2pV2 or a list of card names
    //upload accepts every format the converter reads: yld, ydk, ydke, dlf2pV2 or a list of card names
    function loadUploadedDeck(input) {
      const file = input.files[0];
      input.value = ""; //allow re-uploading the same file
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () =>
        loadDeckText(reader.result, file.name.replace(/\.(yld|ydk|ydke|txt)$/i, ""), "file");
      reader.readAsText(file);
    }
    //load a deck from text (a file's contents or the clipboard), replacing the current deck.
    //name: deck name to show (null: "Untitled Deck"); source: "file" or "clipboard", for the error message
    function loadDeckText(rawText, name, source) {
      //Windows line endings would stick to card names, so normalise them first
      let text = rawText.replace(/\r\n?/g, "\n").trim();
      let namelist, skill = null;
      try {
        if (!text) throw new Error();
        const kind = detectDeckFormat(text);
        namelist = ygolDeck.convert(text, "namelist");
        if (typeof namelist != "string") throw new Error();
        if (kind == "yld") skill = ygolDeck.skill;
        if (kind == "dlf2pV2") {
          //dlf2pV2 is [2_]<cards>_<skill index>_<deck name>; -1 means no skill
          const n = parseInt(text.replace(/^2_/, "").split("_")[1]);
          if (n >= 0) skill = n;
        }
        //unknown cards are skipped, but a deck with no valid cards at all is rejected
        let validCards = namelist
          .split("\n")
          .filter((a) => a && a != "#main" && a != "#extra" && a != "!side");
        if (!validCards.length && ygolDeck.missing.length) throw new Error();
      } catch (e) {
        alert(
          source == "clipboard"
            ? "Error: The clipboard doesn't contain a deck the editor can read."
            : "Error: This file isn't a deck file the editor can read."
        );
        return false;
      }
      //clear the current deck, then load the uploaded one
      if (deckBuilder.editingDeck == "side") switchMainSide();
      deckBuilder.cards = [];
      deckBuilder.side = [];
      deckBuilder.importNamelist(namelist, main, extra, cardwidth);
      deckBuilder.appendDeck(main, extra, cardwidth);
      document.getElementById("deckName").value = name || "Untitled Deck";
      const hasSkill = applyDecodedSkill(skill) && skill !== null; //the uploaded deck's skill, or none
      //pick a matching format: a skill means Duel Links; otherwise a side deck means TCG
      if (hasSkill) setFormat("dl");
      else if (deckBuilder.side.length) setFormat("tcg");
      //phones: switch from the controls panel to the deck so the uploaded cards are shown
      if (_isMobile && document.getElementById("controls").style.display != "none") showControls();
      reportMissingCards();
      return true;
    }
    const params = new URL(document.location).searchParams;

    //load the card/skill/banlist data arrays, then initialise
    function addScript(name) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = name;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    async function loadData() {
      await Promise.all(
        [
          "data/ygolDb.js",
          "data/ygolID.js",
          "data/skillDb.js",
          "data/banlistDl.js",
          "data/banlistDlzg.js",
          "data/banlistMd.js",
          "data/banlistTcg.js",
          "data/banlistOcg.js",
        ].map(addScript)
      );
      ygolDeck = new YgolDeck(cardDb, ygolID, false);
      deckBuilder = new DeckBuilder(cardDb);
      deckBuilder.addBanlist("dl", banlistDl);
      deckBuilder.addBanlist("dlzg", banlistDlzg);
      deckBuilder.addBanlist("md", banlistMd);
      deckBuilder.addBanlist("tcg", banlistTcg);
      deckBuilder.addBanlist("ocg", banlistOcg);
      deckBuilder.addBanlist("unlimited", []);
      deckBuilder.changeFormat(format);
      //dlf2p.com special controls
      if (window.location.href.includes("dlf2p=true")) {
        document.getElementById("testhands").style.display = "none";
        format = "dl";
        deckBuilder.changeFormat("dl");
        document.getElementById("btnFormat").innerHTML = "Format: DL";
        updateSkillVisibility();
      }
      if (params.get("dlf2p") == "true" && params.get("d")) {
        document.getElementById("deckName").value = params
          .get("d")
          .slice(2)
          .split("_")[2];
        deckBuilder.importNamelist(
          ygolDeck.convert(params.get("d"), "namelist"),
          main,
          extra,
          cardwidth
        );
        reportMissingCards();
        //d is 2_<cards>_<skill index>_<deck name>; skill may be -1 or no longer exist
        let skill = skillDb[params.get("d").split("_")[2]];
        if (skill) setSkill(skill.name);
      }
      //normal ygol: load deck from ?yld=
      if (params.get("yld")) {
        let namelist;
        try {
          namelist = ygolDeck.convert("yld://" + params.get("yld"), "namelist");
        } catch (e) {
          alert("Error: Invalid deck code in URL");
        }
        if (namelist) {
          const skill = ygolDeck.skill;
          deckBuilder.importNamelist(namelist, main, extra, cardwidth);
          applyDecodedSkill(skill);
          reportMissingCards();
        }
      }
    }
    loadData();
  </script>
  <script src="data/ygol-nav.js"></script>
</html>
