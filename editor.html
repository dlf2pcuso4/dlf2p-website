<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Deck builder for Duel Links, Master Duel, TCG or OCG in the browser. Includes a solo testing feature for test hands and practising combos."
    />
    <link rel="icon" type="image/x-icon" href="images/logo.png" />
    <title>DLF2P Editor</title>
    <style>
      /* ===== colour scheme "Indigo": every colour in this page is defined here ===== */
      :root {
        --page-bg: #07060c;
        --text: #dee0f7;
        --text-muted: #98a1ec; /* secondary text and placeholders */
        --frame-border: #8672cb; /* outline around the whole page */
        --panel-bg: #0e0b1e; /* boxes inside the frame */
        --panel-border: #8672cb;
        --input-bg: #2a2e54;
        --input-text: #dee0f7;
        --btn-bg: #2a2e54;
        --btn-border: #4a50be;
        --btn-text: #dee0f7;
        --highlight-bg: #4474c9; /* hovered/selected buttons (blues) */
        --highlight-border: #93e3fa; /* also used for focus outlines */
        --highlight-text: #cfeaff;
        --highlight-glow: #2f58c2cc;
        --popup-bg: #07060cf0; /* popups (semi-transparent) */
        --skill-text: #ffff77;
        --scroll-track: #0c0c24;
        --scroll-thumb: #34358f;
        --note-text: #93e3fa; /* notes in the copy/download format popup */
        --overlay-bg: #07060c99; /* dims the page behind the copy/download popup */
        --danger: #ff8a96; /* border of error messages */
        --drop-glow: #93e3facc; /* the box a dragged card would be dropped in */
        --badge-bg: #14163a; /* the "✓ N" copies badge on search results */
      }
      /* Barlow (SIL Open Font License, see fonts/OFL.txt), bundled so every system shows the same font */
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url("fonts/barlow-latin-300-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url("fonts/barlow-latin-ext-300-normal.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/barlow-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/barlow-latin-ext-400-normal.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("fonts/barlow-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Barlow";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("fonts/barlow-latin-ext-500-normal.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Barlow Semi Condensed";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/barlow-semi-condensed-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Barlow Semi Condensed";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("fonts/barlow-semi-condensed-latin-ext-400-normal.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      * {
        padding: 0;
        margin: 0;
      }
      :root {
        /* Barlow is bundled in fonts/; the rest are each system's closest match if it can't load */
        --font: "Barlow", "Bahnschrift", "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      }
      body {
        background-color: var(--page-bg);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font);
        font-weight: lighter;
        font-size: 1.7vw;
        color: var(--text);
        /* phones: no double-tap zoom, so taps on cards and buttons respond straight away */
        touch-action: manipulation;
      }
      #body {
        display: flex;
        border-width: max(0.14vw, 2px);
        border-color: var(--frame-border);
        border-style: solid;
      }
      #body > div {
        margin: 10px;
      }
      .purple {
        background-color: var(--panel-bg);
        border-width: max(0.28vw, 2px);
        border-color: var(--panel-border);
        border-style: solid;
      }
      p {
        margin-top: 2vh;
      }
      input {
        padding: 0.35vw;
        font-size: 1.74vw;
        font-family: var(--font);
        font-weight: lighter;
        color: var(--input-text);
        background-color: var(--input-bg);
        border: none;
        width: 21vw;
        margin-bottom: 1vh;
      }
      button {
        width: 13.9vw;
        height: 6.48vh;
        background-color: var(--btn-bg);
        font-family: var(--font);
        font-weight: lighter;
        font-size: 1.4vw;
        color: var(--btn-text);
        border-width: max(0.28vw, 2px);
        border-color: var(--btn-border);
        border-style: solid;
        cursor: pointer;
        padding: 0px;
        outline: none;
        margin-bottom: 1vh;
        /* fades both ways: lighting up on hover and dimming when the cursor leaves */
        transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease,
          box-shadow 0.25s ease;
      }
      /* hovered buttons, and selected filter/sort buttons, light up in blue */
      button:hover,
      button.selected {
        background-color: var(--highlight-bg);
        border-color: var(--highlight-border);
        color: var(--highlight-text);
        box-shadow: 0 0 max(0.7vw, 6px) var(--highlight-glow);
      }
      button:focus-visible {
        border-color: var(--highlight-border);
      }
      /* the deck name, card search and skill search boxes and the buttons to their right:
         line them up by their middles (not their text baselines, which left the buttons lower) */
      #controls input,
      #controls .filterbtn {
        vertical-align: middle;
      }
      input::placeholder {
        color: var(--text-muted);
        opacity: 1;
      }
      input:focus {
        outline: max(0.14vw, 2px) solid var(--highlight-border);
        outline-offset: 0;
      }
      #main,
      #extra,
      #searchResult,
      #popup {
        scrollbar-color: var(--scroll-thumb) var(--scroll-track);
      }
      ::-webkit-scrollbar {
        width: max(0.6vw, 8px);
        height: max(0.6vw, 8px);
      }
      ::-webkit-scrollbar-track {
        background: var(--scroll-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
      }
      ::-webkit-scrollbar-corner {
        background: var(--scroll-track);
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
      .minibtn {
        width: 10.4vw;
        height: 5.2vh;
        font-size: 1vw;
        border-width: max(0.2vw, 2px);
      }
      .filterbtn {
        width: 6.9vw;
        height: 5.2vh;
        font-size: 1vw;
        border-width: max(0.2vw, 2px);
      }
      #main {
        margin-bottom: 1.3vh;
        padding: 0.7vw;
        width: 43.5vw;
        height: 50vh;
        overflow-y: scroll;
      }
      #extra {
        padding: 0.7vw;
        width: 43.5vw;
        height: 25vh;
        overflow-y: scroll;
      }
      #searchResult {
        width: 29vw;
        height: 50vh;
        overflow-y: scroll;
        margin-bottom: 1.3vh;
        position: relative; /* the "✓ N" badges are placed over the cards */
      }
      /* the box a dragged card would go into */
      #main.dropbox,
      #extra.dropbox,
      #searchResult.dropbox {
        border-color: var(--highlight-border);
        box-shadow: 0 0 max(0.9vw, 8px) var(--drop-glow);
      }
      /* the View Side/Main Deck button lights up like a hovered button when a card can go there */
      #switchMainSide.dropbox {
        background-color: var(--highlight-bg);
        border-color: var(--highlight-border);
        color: var(--highlight-text);
        box-shadow: 0 0 max(0.9vw, 8px) var(--drop-glow);
      }
      /* hints and status messages inside the card boxes */
      .emptynote {
        box-sizing: border-box;
        width: 100%;
        padding: 1vw;
        font-size: 1.05vw;
        line-height: 1.4;
        text-align: center;
        color: var(--text-muted);
      }
      /* card images: keep their size (and show a placeholder colour) while loading */
      img.cimg {
        aspect-ratio: 59 / 86;
        object-fit: cover;
        background-color: var(--input-bg);
      }
      /* copies of a search result already in the deck */
      .owned {
        position: absolute;
        transform: translate(calc(-100% - 0.2vw), calc(-100% - 0.2vw));
        padding: 0.05vw 0.35vw;
        min-width: 1.5vw;
        box-sizing: border-box;
        text-align: center;
        font-size: 0.95vw;
        font-weight: 500;
        color: var(--note-text);
        background: var(--badge-bg);
        border: max(0.1vw, 1px) solid var(--btn-border);
        pointer-events: none;
      }
      /* dragging a card: a copy follows the cursor, the card itself is dimmed */
      #ghost {
        position: fixed;
        z-index: 9000;
        display: none;
        pointer-events: none;
        filter: drop-shadow(0 0.5vw 0.6vw #000a);
      }
      #ghost img {
        display: block;
        width: 100%;
      }
      img.lifted {
        opacity: 0.3;
      }
      body.dragging,
      body.dragging * {
        cursor: grabbing !important;
      }
      /* while a card is dragged, buttons under it don't light up as if hovered; only the View
         Side/Main Deck button does, when the card can be dropped there (#switchMainSide.dropbox).
         Selected buttons keep their look */
      body.dragging button:hover:not(.selected):not(.dropbox) {
        background-color: var(--btn-bg);
        border-color: var(--btn-border);
        color: var(--btn-text);
        box-shadow: none;
      }
      /* short messages at the bottom of the page (instead of alert boxes) */
      #toasts {
        position: fixed;
        left: 50%;
        bottom: 2vh;
        transform: translateX(-50%);
        z-index: 10002;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6vh;
        width: min(36vw, 92vw);
        pointer-events: none;
      }
      .toast {
        display: flex;
        align-items: flex-start;
        gap: 0.8vw;
        box-sizing: border-box;
        width: 100%;
        max-height: 40vh;
        overflow-y: auto;
        padding: 0.6vw 0.9vw;
        font-size: 1vw;
        line-height: 1.4;
        white-space: pre-line;
        color: var(--text);
        background: var(--popup-bg);
        border: max(0.14vw, 2px) solid var(--highlight-border);
        pointer-events: auto;
      }
      .toast.error {
        border-color: var(--danger);
      }
      .toast .toast-text {
        flex: 1;
      }
      .toast button {
        width: auto;
        height: auto;
        margin: 0;
        padding: 0.15vw 0.6vw;
        font-size: 1vw;
        border-width: max(0.14vw, 1px);
        flex: none;
      }
      .toast button.toast-close {
        border-color: transparent;
        background: none;
        box-shadow: none;
        color: var(--text-muted);
      }
      /* phones: Deck / Search tabs (hidden on desktop) */
      #tabs {
        display: none;
      }
      #popupCss1 {
        width: 100vw;
        height: 100vh;
        margin: 0px;
        padding: 0px;
        z-index: 9999;
        position: fixed;
        display: none;
        justify-content: center;
      }
      #popupCss2 {
        height: 100vh;
        margin: 0px;
        padding: 0px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #popup {
        width: 55.6vw;
        height: 80vh;
        overflow: scroll;
        background-color: var(--popup-bg);
        padding: 1.4vw;
        justify-content: center;
        font-size: 1vw;
        position: relative;
      }
      .cardname {
        font-size: 1.4vw;
        text-align: center;
      }
      .skilltext {
        color: var(--skill-text);
        cursor: pointer;
      }
      .filterheader {
        font-size: 1.7vw;
        margin-bottom: 0.7vw;
      }
      img {
        transition: filter 0.5s ease-out;
        user-select: none;
        -webkit-user-select: none;
        /* iOS: no "save image" menu when holding a card */
        -webkit-touch-callout: none;
      }
      /* card info popup */
      #popup .cardmeta {
        margin-top: 1vh;
        text-align: center;
        color: var(--text-muted);
      }
      /* banlist status and rarity, below the card text */
      #popup .cardmeta.cardstatus {
        margin-top: 0.4vh;
        text-align: left;
      }
      #popup .cardmeta.cardstatus.first {
        margin-top: 2vh;
      }
      #popup .cardmeta b {
        font-weight: 500;
        color: var(--text);
      }
      #popup .carddesc {
        white-space: pre-line;
      }
      #popup .obtain {
        margin-top: 0.5vh;
        padding-left: 1.4vw;
        color: var(--text-muted);
      }
      #popup h3 {
        margin-top: 2vh;
        font-size: 1.1vw;
        font-weight: 500;
      }
      /* sticky Clear Filters / Done buttons at the bottom of the filter popup */
      #popup .filterfoot {
        position: sticky;
        bottom: 10px;
        text-align: end;
      }
      #popup .filterfoot button {
        margin-left: 0.5vw;
      }
      /* set skill above the deck: click it to read the skill's text */
      #skillname:not(.set) {
        cursor: default;
      }
      .skill-desc {
        white-space: pre-line;
      }
      /* ===== copy/download format popup ===== */
      #exportLayer {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        justify-content: center;
        align-items: center;
        background-color: var(--overlay-bg);
      }
      #exportLayer.open {
        display: flex;
      }
      #exportBox {
        width: min(30vw, 92vw);
        max-height: 90vh;
        overflow-y: auto;
        padding: 1.2vw;
        background-color: var(--popup-bg);
        border: max(0.28vw, 2px) solid var(--panel-border);
        font-size: 1vw;
      }
      #exportTitle {
        margin: 0 0 0.8vw;
        font-size: 1.4vw;
      }
      #exportBox button.export-option {
        display: block;
        width: 100%;
        height: auto;
        margin: 0 0 0.6vw;
        padding: 0.6vw 0.8vw;
        text-align: left;
        font-size: 1.2vw;
      }
      #exportBox .export-desc {
        display: block;
        margin-top: 0.2vw;
        font-size: 0.9vw;
        color: var(--text-muted);
      }
      #exportBox button.export-option:hover .export-desc,
      #exportBox button.export-option.selected .export-desc {
        color: var(--highlight-text);
      }
      #exportBox .export-note {
        display: block;
        margin-top: 0.2vw;
        font-size: 0.9vw;
        color: var(--note-text);
      }
      #exportBox button.export-option:hover .export-note,
      #exportBox button.export-option.selected .export-note {
        color: var(--highlight-text);
      }
      #exportBox textarea {
        display: block;
        width: 100%;
        height: 10vw;
        margin: 0 0 0.6vw;
        padding: 0.5vw;
        box-sizing: border-box;
        resize: vertical;
        font-family: var(--font);
        font-size: 1vw;
        color: var(--input-text);
        background-color: var(--input-bg);
        border: none;
      }
      #exportBox textarea:focus {
        outline: max(0.14vw, 2px) solid var(--highlight-border);
      }
      #exportBox .export-hint {
        margin: 0 0 0.6vw;
        font-size: 0.9vw;
        color: var(--text-muted);
      }
      @media (max-aspect-ratio: 1/1) {
        #toasts {
          width: 92vw;
          bottom: 3vw;
        }
        .toast {
          font-size: 3.5vw;
          padding: 2.5vw 3vw;
          gap: 2vw;
        }
        .toast button {
          font-size: 3.5vw;
          padding: 0.5vw 2vw;
        }
        .emptynote {
          font-size: 3.6vw;
          padding: 4vw;
        }
        .owned {
          font-size: 3vw;
          min-width: 5vw;
          padding: 0 1vw;
        }
        #popup h3 {
          font-size: 3.8vw;
        }
        #exportBox textarea {
          height: 35vw;
          font-size: 3.5vw;
          padding: 2vw;
        }
        #exportBox .export-hint {
          font-size: 3.3vw;
        }
        #exportBox {
          width: 92vw;
          padding: 4vw;
          font-size: 3.5vw;
        }
        #exportTitle {
          font-size: 4.5vw;
          margin-bottom: 3vw;
        }
        #exportBox button.export-option {
          font-size: 4.2vw;
          padding: 2.5vw 3vw;
          margin-bottom: 2.5vw;
        }
        #exportBox .export-desc,
        #exportBox .export-note {
          font-size: 3.3vw;
        }
      }
    </style>
  </head>
  <body>
    <div id="popupCss1">
      <div id="popupCss2">
        <div id="popup"></div>
      </div>
    </div>
    <div id="body">
      <!-- phones: switch between the deck and the search/controls -->
      <div id="tabs">
        <button data-screen="deck" onclick="showScreen('deck')">Deck</button>
        <button data-screen="search" onclick="showScreen('search')">Search</button>
      </div>
      <div id="deck">
        <button id="btnFormat" class="minibtn" onclick="switchFormat()">
          Format: DL
        </button>
        <button class="minibtn" onclick="sortDeck()">Sort Deck</button>
        <button class="minibtn" id="btnClearDeck" onclick="askClearDeck()">Clear Deck</button>
        <button id="switchMainSide" class="minibtn" onclick="switchMainSide()">
          View Side Deck
        </button>
        <button id="switchMode" class="minibtn" onclick="switchMode()">
          Mode: View
        </button>
        <div class="cardname skilltext" id="skillname" onclick="showSkillInfo()">Skill Not Set</div>
        <div id="main" class="purple"><div class="emptynote">Loading card data...</div></div>
        <div id="extra" class="purple"></div>
      </div>
      <div id="controls">
        <input
          id="deckName"
          value="Untitled Deck"
          type="text"
          placeholder="Deck name..."
          autocomplete="off"
          maxlength="60"
        />
        <button class="filterbtn" id="switchModeDesktop" onclick="switchMode()">Mode: View</button>
        <br />
        <input
          id="searchInput"
          type="text"
          placeholder="Search card..."
          autocomplete="off"
        />
        <button class="filterbtn" onclick="openFilter()">Options</button>
        <br />
        <input
          id="skillInput"
          type="text"
          placeholder="Search skill..."
          onkeyup="skillSearch()"
          autocomplete="off"
        />
        <button class="filterbtn" id="skillClear" onclick="setSkill(null)">Clear</button>
        <div id="searchResult" class="purple"><div class="emptynote">Loading card data...</div></div>
        <button id="testhands" onclick="testHands()">Test Hands</button>
        <button id="copyDeck" onclick="openExport('copy')">Copy</button><br />
        <button id="upload" onclick="openUpload()">Upload</button>
        <button id="download" onclick="openExport('download')">Download</button>
        <input
          id="uploadInput"
          type="file"
          accept=".yld,.ydk,.txt"
          style="display: none"
          onchange="loadUploadedDeck(this)"
        />
      </div>
    </div>
    <div id="exportLayer" onclick="closeExport()">
      <div
        id="exportBox"
        tabindex="-1"
        role="dialog"
        aria-modal="true"
        aria-labelledby="exportTitle"
        onclick="event.stopPropagation()"
      >
        <p id="exportTitle">Copy deck as</p>
        <div id="exportOptions"></div>
      </div>
    </div>
    <!-- the copy of a card that follows the cursor while it's dragged -->
    <div id="ghost"></div>
    <!-- short messages (instead of alert boxes) -->
    <div id="toasts" aria-live="polite"></div>
  </body>
  <script>
    //=== YgolDeck: deck format conversion (yld / ydk / ydke / dlf2pV2) ===
    class YgolDeck {
      constructor(db, ygolID, isRush) {
        this.db = db;
        this.ygolID = ygolID;
        this.isRush = isRush;
        //cards skipped by the last convert() because they aren't in the database
        this.missing = [];
        //skill index (into skillDb) read by the last convert() from a yld code, or null
        this.skill = null;
      }
      hasCard(name) {
        if (!this.dbNames) this.dbNames = new Set(this.db.map((a) => a.name));
        return this.dbNames.has(name);
      }
      //find a card by passcode: its main passcode first, then the passcodes of its other arts
      findByPasscode(id) {
        id = Number(id);
        return (
          this.db.find((a) => a.konamiID == id) ||
          this.db.find(
            (a) => a.altKonamiIDs && a.altKonamiIDs.some((alt) => Number(alt) == id)
          )
        );
      }
      //skill: optional skill index (into skillDb), only stored by the yld format
      convert(d, format, skill = null) {
        this.missing = [];
        this.skill = null;
        switch (format) {
          case "yld":
            return this.namelist_to_yld(this.toNamelist(d), skill);
          case "ydk":
            return this.namelist_to_ydk(this.toNamelist(d));
          case "ydke":
            return this.ydk_to_ydke(this.namelist_to_ydk(this.toNamelist(d)));
          case "dlf2pV2":
            return this.namelist_to_dlf2pV2(this.toNamelist(d));
          case "namelist":
            return this.toNamelist(d);
        }
      }
      toNamelist(d) {
        if (d.includes("#main") || d.includes("#extra")) {
          return this.ydk_to_namelist(d);
        } else if (d.includes("ydke://")) {
          return this.ydk_to_namelist(this.ydke_to_ydk(d));
        } else if (d.includes("yld://")) {
          return this.yld_to_namelist(d);
        } else if (d.slice(0, 2) == "3_") {
          //dlf2pv3
        } else {
          return this.dlf2pV2_to_namelist(d);
        }
      }
      isEDMonster(name) {
        let card = this.db.filter((a) => a.name == name)[0];
        if (!card) return false;
        return (
          card.monsterType.includes("Fusion") ||
          card.monsterType.includes("Synchro") ||
          card.monsterType.includes("Xyz") ||
          card.monsterType.includes("XYZ") ||
          card.monsterType.includes("Link")
        );
      }
      ydk_to_ydke(ydk) {
        function Uint32Array_to_ydke(main, extra, side) {
          function passcodesToBase64(passcodes) {
            const bytes = new Uint8Array(passcodes.buffer);
            let binaryString = "";
            for (let i = 0; i < bytes.length; i++) {
              binaryString += String.fromCharCode(bytes[i]);
            }
            return btoa(binaryString);
          }
          return (
            "ydke://" +
            passcodesToBase64(main) +
            "!" +
            passcodesToBase64(extra) +
            "!" +
            passcodesToBase64(side) +
            "!"
          );
        }
        function stringsToUint32Array(stringsArray) {
          const uint32Array = new Uint32Array(stringsArray.length);
          for (let i = 0; i < stringsArray.length; i++)
            uint32Array[i] = parseInt(stringsArray[i], 10);
          return uint32Array;
        }
        let main = ydk
          .split("#main")[1]
          .split("#extra")[0]
          .split("\n")
          .filter((a) => a != "");
        let extra = ydk
          .split("#extra")[1]
          .split("!side")[0]
          .split("\n")
          .filter((a) => a != "");
        let side = ydk
          .split("!side")[1]
          .split("\n")
          .filter((a) => a != "");
        return Uint32Array_to_ydke(
          stringsToUint32Array(main),
          stringsToUint32Array(extra),
          stringsToUint32Array(side)
        );
      }
      ydke_to_ydk(ydke) {
        function ydke_to_Uint32Array(ydke) {
          function base64ToPasscodes(base64) {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
              bytes[i] = binaryString.charCodeAt(i);
            }
            return new Uint32Array(bytes.buffer);
          }
          const components = ydke.slice("ydke://".length).split("!");
          return {
            main: base64ToPasscodes(components[0]),
            extra: base64ToPasscodes(components[1]),
            side: base64ToPasscodes(components[2]),
          };
        }
        return JSON.stringify(ydke_to_Uint32Array(ydke))
          .replace('"main"', "#main")
          .replace('"extra"', "#extra")
          .replace('"side"', "!side")
          .replace(/{/g, "")
          .replace(/}/g, "")
          .replace(/:/g, ",")
          .split(",")
          .filter((a) => !a.includes('"'))
          .join("\n");
      }
      ydk_to_namelist(ydk) {
        let arr = ydk.split("\n").filter((a) => a != "");
        for (let i = 0; i < arr.length; i++) {
          if (arr[i][0] != "#" && arr[i][0] != "!") {
            if (isNaN(arr[i])) {
              console.log(ydk);
              return ydk;
            } else {
              console.log(arr[i]);
              let found = this.findByPasscode(arr[i]);
              let card = found ? [found] : [];
              if (card.length) {
                arr[i] = card[0].name;
              } else {
                card = this.db.filter(
                  (a) =>
                    a.konamiID == Number(arr[i]) + 1 ||
                    a.konamiID == Number(arr[i]) - 1
                );
                if (!card.length) this.missing.push(`Unknown card (ID ${arr[i]})`);
                arr[i] = card.length ? card[0].name : "";
              }
            }
          }
        }
        return arr.filter((a) => a != "").join("\n");
      }
      namelist_to_ydk(namelist) {
        let arr = namelist.split("\n");
        for (let i = 0; i < arr.length; i++) {
          let card = this.db.filter(
            (a) => a.name == arr[i] && (this.isRush ? a.rush : !a.rush)
          );
          if (card.length) arr[i] = card[0].konamiID || arr[i];
        }
        if (!namelist.includes("!side")) arr.push("!side");
        return arr.join("\n");
      }
      //yld code: "1" + main + "c" + extra + "c" + side + "c" + skill index, in base 13, then base 64.
      //cards are 5-digit ygolID indexes, "a"/"b" repeat the previous card once/twice.
      //every section after main is optional, so older codes (no side deck, no skill) still decode.
      yld_to_namelist(yld) {
        let raw = this.base13Encode(this.base64Decode(yld.replace("yld://", ""))).slice(1);
        let sections = raw.split("c");
        if (sections.length > 4) throw new Error("Invalid yld deck code");
        const headers = ["#main", "#extra", "!side"];
        let d = "";
        let prev = 0;
        for (let s = 0; s < Math.min(sections.length, 3); s++) {
          d += headers[s] + "\n";
          let chunks =
            sections[s]
              .replace(/a/g, "xxxxx")
              .replace(/b/g, "xxxxxxxxxx")
              .match(/.{1,5}/g) || [];
          for (let el of chunks) {
            //a chunk that isn't a 5-digit id means the code itself is corrupted
            if (el != "xxxxx" && !/^\d{5}$/.test(el))
              throw new Error("Invalid yld deck code");
            let idx = el == "xxxxx" ? prev : Number(el);
            let name = this.ygolID[idx];
            if (name !== undefined && this.hasCard(name)) {
              d += name + "\n";
            } else {
              //skip cards that aren't in the database instead of failing
              this.missing.push(name !== undefined ? name : `Unknown card (ID ${idx})`);
            }
            if (el != "xxxxx") prev = Number(el);
          }
        }
        //4th section: the set skill
        if (sections.length == 4 && sections[3] !== "") {
          if (!/^\d+$/.test(sections[3])) throw new Error("Invalid yld deck code");
          this.skill = Number(sections[3]);
        }
        return d;
      }
      namelist_to_yld(namelist, skill = null) {
        let d = "1";
        let prev = "";
        for (let el of namelist.split("\n")) {
          if (el.includes("#extra") || el.includes("!side")) {
            d += "c";
          } else if (this.ygolID.indexOf(el) != -1) {
            let curr = ("0000" + this.ygolID.indexOf(el)).slice(-5);
            d += prev == curr ? "a" : curr;
            prev = curr;
            d = d.replace("aa", "b");
          }
        }
        //the skill goes after the side deck, so add any missing extra/side separators first
        if (Number.isInteger(skill) && skill >= 0) {
          for (let seps = (d.match(/c/g) || []).length; seps < 2; seps++) d += "c";
          d += "c" + skill;
        }
        return "yld://" + this.base64Encode(this.base13Decode(d));
      }
      dlf2pV2_to_namelist(dlf2pV2) {
        let c = dlf2pV2.split("_")[0] == "2" ? dlf2pV2.slice(2) : dlf2pV2;
        let split = decodeURIComponent(c).split("_");
        let arr = this.base13Encode(this.base63Decode(split[0]));
        if (arr[0] != "a") arr = "0" + arr;
        arr = arr
          .replace(/a/g, "00")
          .replace(/c/g, "bb")
          .replace(/b/g, "xxxxxxxxxx")
          .match(/.{1,10}/g);
        let d = [];
        let prev = null; //last decoded card, null if it was skipped
        for (let el of arr) {
          if (el != "xxxxxxxxxx") {
            let card = this.findByPasscode(el);
            prev = card ? card.name : null;
            if (!card) this.missing.push(`Unknown card (ID ${Number(el)})`);
          } else if (prev === null) {
            this.missing.push(this.missing.at(-1) || "Unknown card");
          }
          //skip cards that aren't in the database instead of failing
          if (prev !== null) d.push(prev);
        }
        let main = d.filter((a) => !this.isEDMonster(a));
        let extra = d.filter((a) => this.isEDMonster(a));
        if (split[3])
          for (let el of split[3].split("-")) {
            if (!this.hasCard(el)) {
              this.missing.push(el);
            } else if (this.isEDMonster(el)) {
              extra.push(el);
            } else {
              main.push(el);
            }
          }
        return `#main\n${main.join("\n")}\n#extra\n${extra.join("\n")}`;
      }
      namelist_to_dlf2pV2(namelist) {
        let darr = [];
        let special = [];
        let prev = "";
        for (let el of namelist.split("\n")) {
          if (el.includes("!side")) break;
          if (!el.includes("#main") && !el.includes("#extra")) {
            let card = this.db.filter((a) => a.name == el)[0];
            if (card.konamiID) {
              let id = ("000000000" + card.konamiID).slice(-10);
              darr.push(id == prev ? "b" : id);
              prev = id;
            } else {
              special.push(el);
            }
          }
        }
        return `${this.base63Encode(
          this.base13Decode(darr.join("").replace(/bb/g, "c").replace(/00/g, "a"))
        )}_-1_Deck${special.length ? `_${special.join("-")}` : ""}`;
      }
      base64Encode(str) {
        if (str == "-1") return "-1";
        let input = BigInt(str);
        let chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
        let result = "";
        while (input > 0n) {
          result = chars[input - (input / 64n) * 64n] + result;
          input = BigInt(input / 64n);
        }
        return result;
      }
      base64Decode(str) {
        if (str == "-1") return "-1";
        let result = 0n;
        let chars =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
        for (let i = str.length - 1; i >= 0; i--) {
          result +=
            BigInt(chars.indexOf(str[i])) * 64n ** BigInt(str.length - 1 - i);
        }
        return result;
      }
      base13Encode(str) {
        if (str == "-1") return "-1";
        let input = BigInt(str);
        let chars = "0123456789abc";
        let result = "";
        while (input > 0n) {
          result = chars[input - (input / 13n) * 13n] + result;
          input = BigInt(input / 13n);
        }
        return result;
      }
      base13Decode(str) {
        if (str == "-1") return "-1";
        let result = 0n;
        let chars = "0123456789abc";
        for (let i = str.length - 1; i >= 0; i--) {
          result +=
            BigInt(chars.indexOf(str[i])) * 13n ** BigInt(str.length - 1 - i);
        }
        return result;
      }
      base63Encode(str) {
        if (str == "-1") return "-1";
        let input = BigInt(str);
        let chars =
          "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-";
        let result = "";
        while (input > 0n) {
          result = chars[input - (input / 63n) * 63n] + result;
          input = BigInt(input / 63n);
        }
        return result;
      }
      base63Decode(str) {
        if (str == "-1") return "-1";
        let result = 0n;
        let chars =
          "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-";
        for (let i = str.length - 1; i >= 0; i--) {
          result +=
            BigInt(chars.indexOf(str[i])) * 63n ** BigInt(str.length - 1 - i);
        }
        return result;
      }
    }

    //=== DeckBuilder: deck state, card search/filters, rendering ===
    class DeckBuilder {
      //card name (URL-encoded) -> image address that loaded for it: local file, remote art or the error image
      static loadedSrc = new Map();
      constructor(ygolDb, name = "Untitiled Deck", cards = [], side = []) {
        this.ygolDb = ygolDb;
        this.name = name;
        this.cards = cards; //card objects from ygolID
        this.side = side;
        this.format = "tcg";
        this.banlists = [];
        this.editingDeck = "main";
        this.errorimage = this.url("images/errorimage.jpg");
      }
      url(url) {
        return url;
      }
      name_url(str) {
        let fileName = str.replace(/[^a-zA-Z0-9\s_\-\.\(\)%]/g, "");
        fileName = fileName.replace(/\s/g, "_");
        return fileName.substring(0, 255);
      }
      htmlEncode(str) {
        if (str.includes("!htm!")) {
          return str;
        } else {
          return "!htm!" + str.replace(/"/g, "{quot}");
        }
      }
      htmlDecode(str) {
        if (str.includes("!htm!")) {
          return str.replace("!htm!", "").replace(/{quot}/g, '"');
        } else {
          return str;
        }
      }
      renameDeck(name) {
        this.name = name;
      }
      changeFormat(format) {
        this.format = format;
      }
      addBanlist(format, arrBanlist) {
        this.banlists.push({ format: format, banlist: arrBanlist });
      }
      switchEditingDeck(mainDiv, extraDiv, width) {
        if (this.editingDeck == "main") {
          this.editingDeck = "side";
          this.appendSide(mainDiv, extraDiv, width);
          return `View Main Deck`;
        } else {
          this.editingDeck = "main";
          this.appendDeck(mainDiv, extraDiv, width);
          return `View Side Deck`;
        }
      }
      appendCards(arrNames, targetDiv, width, location) {
        let cardno = -1;
        for (let el of arrNames) {
          cardno++;
          let altSrc = this.errorimage;
          altSrc = el.altimg;
          //if (el.konamiID) altSrc = `https://images.ygoprodeck.com/images/cards/${Number(el.konamiID)}.jpg`;
          let noRarity = false;
          if (this.format == "dl" || this.format == "dlzg") {
            if (el.rarityDl) {
              targetDiv.insertAdjacentHTML(
                "beforeend",
                `<img src="images/dltag${el.rarityDl}.png" style="width:${
                  (width * 2) / 3
                }px;height:${width / 6}px;margin-left:${
                  width / 3
                }px;vertical-align: top;">`
              );
            } else {
              noRarity = true;
            }
          }
          if (this.format == "md") {
            if (el.rarityMd) {
              targetDiv.insertAdjacentHTML(
                "beforeend",
                `<img src="images/mdtag${el.rarityMd}.png" style="width:${
                  (width * 2) / 3
                }px;height:${width / 6}px;margin-left:${
                  width / 3
                }px;vertical-align: top;">`
              );
            } else {
              noRarity = true;
            }
          }
          targetDiv.insertAdjacentHTML(
            "beforeend",
            //class cimg: keeps the card's shape with a placeholder colour while it loads;
            //loading="lazy": search results only load once they're scrolled into view
            `<img class="cimg" loading="lazy" src="${
              //start from the address that worked last time (see loadedSrc), so a re-render
              //doesn't retry a missing local image first and leave the card blank meanwhile
              DeckBuilder.loadedSrc.get(encodeURIComponent(el.name)) ||
              this.url(`images/cards/${this.name_url(el.name)}.jpg`)
            }" data-key="${encodeURIComponent(el.name)}" onload="DeckBuilder.loadedSrc.set(this.dataset.key, this.src)" alt="${
              escHtml(el.name)
            }" cardno="${cardno}" location="${location}" style="width:${width}px;margin:${
              (this.format == "dl" ||
                this.format == "dlzg" ||
                this.format == "md") &&
              noRarity == false
                ? `${width / 6}px 0px 0px -${width}px`
                : "0px"
            }" onmousedown="cardClicked(\`${targetDiv.id}\`,\`${this.htmlEncode(
              el.name
            )}\`,this,event)" onerror="if(this.src==\`${altSrc}\`){this.onerror=null; this.src=\`${
              this.errorimage
            }\`;}else{this.src=\`${altSrc}\`}" draggable="false">`
          );
          let banlistCard = this.banlists
            .filter((a) => a.format == this.format)[0]
            .banlist.filter((a) => a.name == el.name)[0];
          if (banlistCard) {
            targetDiv.insertAdjacentHTML(
              "beforeend",
              `<img src="images/${banlistCard.banStatus}.png" style="width:${
                width / 3
              }px;margin:-${(width * 35) / 24}px ${(width * 2) / 3}px ${
                (width * 9) / 8
              }px -${width}px ;">`
            );
          }
        }
      }
      //every change to the deck ends with appendDeck or appendSide, which call onRender
      //(set by the page: undo history, saving, the URL, the search badges)
      appendDeck(mainDiv, extraDiv, width) {
        mainDiv.innerHTML = "";
        extraDiv.innerHTML = "";
        let main = this.cards.filter((a) => a.priorityDl < 2000000000);
        let extra = this.cards.filter((a) => a.priorityDl >= 2000000000);
        this.appendCards(main, mainDiv, width, "main");
        this.appendCards(extra, extraDiv, width, "extra");
        if (!main.length) this.emptyHint(mainDiv, extra.length ? "The Main Deck is empty." : "The deck is empty.");
        if (this.onRender) this.onRender();
      }
      appendSide(mainDiv, extraDiv, width) {
        mainDiv.innerHTML = "";
        extraDiv.innerHTML = "";
        this.appendCards(this.side, mainDiv, width, "side");
        if (!this.side.length) this.emptyHint(mainDiv, "The Side Deck is empty.");
        if (this.onRender) this.onRender();
      }
      //redraw whichever deck is shown
      render(mainDiv, extraDiv, width) {
        if (this.editingDeck == "main") this.appendDeck(mainDiv, extraDiv, width);
        else this.appendSide(mainDiv, extraDiv, width);
      }
      emptyHint(div, first) {
        const how =
          typeof _isMobile != "undefined" && _isMobile
            ? "Search for a card, switch to Edit mode, then tap it."
            : "Search for a card, switch to Edit mode, then click it or drag it here.";
        div.insertAdjacentHTML("beforeend", `<div class="emptynote">${first}<br>${how}</div>`);
      }
      //copies of a card in the whole deck (main, extra and side), for the 3-copy limit
      copiesOf(name) {
        let n = 0;
        for (const c of this.cards) if (c.name == name) n++;
        for (const c of this.side) if (c.name == name) n++;
        return n;
      }
      //true if another copy of the card can't be added. this.refusal says why an add failed:
      //"limit" (3 copies already), "extra" (Extra Deck monster dropped on the Main Deck),
      //"main" (Main Deck card dropped on the Extra Deck) or "unknown"
      atLimit(name) {
        return this.copiesOf(name) >= 3 && !window.location.href.includes("UNLIMITED_MODE=ON");
      }
      //remove every card of the main+extra deck ("main"), the side deck ("side") or both ("all")
      clearDeck(which, mainDiv, extraDiv, width) {
        if (which == "main" || which == "all") this.cards = [];
        if (which == "side" || which == "all") this.side = [];
        this.render(mainDiv, extraDiv, width);
      }
      importNamelist(namelist, mainDiv, extraDiv, width) {
        for (let line of namelist.split("\n")) {
          if (line.includes("!side"))
            this.switchEditingDeck(mainDiv, extraDiv, width);
          if (
            !line.includes("#main") &&
            !line.includes("#extra") &&
            !line.includes("!side") &&
            line.length
          ) {
            this.addCard(line, mainDiv, extraDiv, width);
          }
        }
        if (this.editingDeck == "side")
          this.switchEditingDeck(mainDiv, extraDiv, width);
      }
      sortDeck(mainDiv, extraDiv, width, format = "dl") {
        if (this.editingDeck == "main") {
          this.cards.sort((a, b) =>
            format == "dl" || format == "dlzg"
              ? b.priorityDl - a.priorityDl
              : b.priorityMd - a.priorityMd
          );
          this.appendDeck(mainDiv, extraDiv, width);
        } else {
          this.side.sort((a, b) =>
            format == "dl" || format == "dlzg"
              ? b.priorityDl - a.priorityDl
              : b.priorityMd - a.priorityMd
          );
          this.appendSide(mainDiv, extraDiv, width);
        }
      }
      //move card number `from` of a deck box so it ends up at position `to` of the list
      //without it (the cards in between shift over). Dragging a deck card within its box
      moveCard(from, to, location, mainDiv, extraDiv, width) {
        from = Number(from);
        let main = this.cards.filter((a) => a.priorityDl < 2000000000);
        let extra = this.cards.filter((a) => a.priorityDl >= 2000000000);
        let list = location == "side" ? this.side : location == "main" ? main : extra;
        if (!list[from]) return;
        const [card] = list.splice(from, 1);
        list.splice(Math.min(to, list.length), 0, card);
        if (location != "side") this.cards = main.concat(extra);
        this.render(mainDiv, extraDiv, width);
      }
      //card info popup: picture, type and stats, banlist status in the current format,
      //Duel Links / Master Duel rarity (and how to get it in Duel Links), then the text
      displayCard(name, targetDiv, width) {
        const realName = this.htmlDecode(name);

        const img = document.createElement("img");
        img.className = "cimg";
        img.alt = c.name;
        img.style.width = width + "px";
        const tries = [
          DeckBuilder.loadedSrc.get(encodeURIComponent(c.name)),
          this.url(`images/cards/${this.name_url(c.name)}.jpg`),
          c.altimg,
          this.errorimage,
        ].filter((v, i, a) => v && a.indexOf(v) == i);
        img.onerror = () => {
          tries.shift();
          if (tries.length) img.src = tries[0];
          else img.onerror = null;
        };
        img.src = tries[0];
        box.appendChild(img);
        targetDiv.appendChild(box);

        const lines = [];
        if (c.type == "Monster") {
          const kinds = (c.monsterType || []).join(" / ");
          lines.push(`[${escHtml(c.race || "")}${kinds ? " / " + escHtml(kinds) : ""}]`);
          const stats = [];
          if (c.attribute) stats.push(escHtml(c.attribute));
          const isLink = (c.monsterType || []).includes("Link");
          const isXyz = (c.monsterType || []).some((t) => t == "Xyz" || t == "XYZ");
          if (isLink && c.linkRating) stats.push(`Link-${c.linkRating}`);
          else if (c.level) stats.push(`${isXyz ? "Rank" : "Level"} ${c.level}`);
          if (c.scale !== undefined && c.scale !== null) stats.push(`Scale ${c.scale}`);
          if (c.atk !== undefined) stats.push(`ATK ${c.atk === null ? "?" : c.atk}`);
          if (!isLink && c.def !== undefined) stats.push(`DEF ${c.def === null ? "?" : c.def}`);
          if (isLink && c.linkArrows && c.linkArrows.length) stats.push(`Arrows: ${escHtml(c.linkArrows.join(", "))}`);
          if (stats.length) lines.push(stats.join(" · "));
        } else if (c.type) {
          lines.push(`[${escHtml(c.race ? c.race + " " : "")}${escHtml(c.type)}]`);
        }
        //below the card text (left-aligned): banlist status in the current format (only when
        //the card is on the banlist, not for unlimited cards), then the Duel Links / Master
        //Duel rarity or "Not released"
        const status = [];
        const fmt = this.format;
        if (fmt != "unlimited") {
          const list = (this.banlists.find((b) => b.format == fmt) || { banlist: [] }).banlist;
          const entry = list.find((b) => b.name == c.name);
          if (entry) status.push(`${fmt.toUpperCase()} banlist: <b>${escHtml(entry.banStatus)}</b>`);
        }
        if ((fmt == "dl" || fmt == "dlzg") && c.rarityDl) status.push(`Duel Links rarity: <b>${escHtml(c.rarityDl)}</b>`);
        if ((fmt == "dl" || fmt == "dlzg") && !c.rarityDl && !c.rush) status.push("Not released in Duel Links");
        if (fmt == "md") status.push(c.rarityMd ? `Master Duel rarity: <b>${escHtml(c.rarityMd)}</b>` : "Not released in Master Duel");
        targetDiv.insertAdjacentHTML(
          "beforeend",
          `<p class="cardname">${escHtml(c.name)}</p>` +
            lines.map((l) => `<p class="cardmeta">${l}</p>`).join("") +
            `<p class="carddesc">${escHtml(c.description || "")}</p>` +
            status.map((l, i) => `<p class="cardmeta cardstatus${i ? "" : " first"}">${l}</p>`).join("")
        );
        //Duel Links formats: where the card comes from
        if ((fmt == "dl" || fmt == "dlzg") && c.obtain && c.obtain.length) {
          const kind = { sets: "Box", characters: "Character", otherSources: "Other" };
          const items = c.obtain.map((o) => {
            const src = (o.source && o.source.name) || "?";
            const what = (o.source && o.source.type) || kind[o.type] || "";
            const extra = [what, o.subSource].filter(Boolean).join(", ");
            return `<li>${escHtml(src)}${extra ? ` <span>(${escHtml(extra)})</span>` : ""}</li>`;
          });
          targetDiv.insertAdjacentHTML("beforeend", `<h3>How to get it (Duel Links)</h3><ul class="obtain">${items.join("")}</ul>`);
        }
        targetDiv.scrollTop = 0;
      }
      searchCard(name, targetDiv, width, criterias = [], sort = "", limit = 300) {
        targetDiv.innerHTML = "";
        let filtered = this.ygolDb.filter((a) => {
          let n = a.name.toLowerCase();
          let d = a.description.toLowerCase();
          return n.includes(name.toLowerCase()) || d.includes(name.toLowerCase());
        });
        //apply filters
        let showall = false;
        for (let term of criterias) {
          if (term.includes("Monster")) {
            filtered = filtered.filter((a) => a.type == "Monster");
            if (term != "Monster") {
              let monsterType = term.replace(" Monster", "");
              if (monsterType == "Main Deck") {
                filtered = filtered.filter(
                  (a) =>
                    !(
                      a.monsterType.includes("Fusion") ||
                      a.monsterType.includes("Synchro") ||
                      a.monsterType.includes("Xyz") ||
                      a.monsterType.includes("Link")
                    )
                );
              } else if (monsterType == "Extra Deck") {
                filtered = filtered.filter(
                  (a) =>
                    a.monsterType.includes("Fusion") ||
                    a.monsterType.includes("Synchro") ||
                    a.monsterType.includes("Xyz") ||
                    a.monsterType.includes("Link")
                );
              } else if (monsterType == "Non-Effect") {
                filtered = filtered.filter(
                  (a) => !a.monsterType.includes("Effect")
                );
              } else {
                filtered = filtered.filter((a) =>
                  a.monsterType.includes(monsterType)
                );
              }
            }
          } else if (term.includes("Spell") && !term.includes("caster")) {
            filtered = filtered.filter((a) => a.type == "Spell");
            if (term != "Spell") {
              let spellType = term.replace(" Spell", "");
              filtered = filtered.filter((a) => (a.race || "").includes(spellType));
            }
          } else if (term.includes("Trap")) {
            filtered = filtered.filter((a) => a.type == "Trap");
            if (term != "Trap") {
              let trapType = term.replace(" Trap", "");
              filtered = filtered.filter((a) => (a.race || "").includes(trapType));
            }
          } else if (term.includes("Level/Rank")) {
            let levelrank = term.replace("Level/Rank ", "");
            filtered = filtered.filter((a) => a.level == levelrank);
          } else if (term.includes("Link")) {
            let link = term.replace("Link ", "");
            filtered = filtered.filter((a) => a.linkRating == link);
          } else if (term.includes("(DL)")) {
            if (term.includes("Free")) {
              filtered = filtered.filter((a) => a.zeroGem);
            } else if (term.includes("Released")) {
              if (term.includes("Not")) {
                filtered = filtered.filter((a) => !a.rarityDl);
              } else {
                filtered = filtered.filter((a) => a.rarityDl);
              }
            } else {
              filtered = filtered.filter(
                (a) => a.rarityDl == term.replace(" (DL)", "")
              );
            }
          } else if (term.includes("(MD)")) {
            if (term.includes("Released")) {
              if (term.includes("Not")) {
                filtered = filtered.filter((a) => !a.rarityMd);
              } else {
                filtered = filtered.filter((a) => a.rarityMd);
              }
            } else {
              filtered = filtered.filter(
                (a) => a.rarityMd == term.replace(" (MD)", "")
              );
            }
          } else if (term == "Handtrap") {
            filtered = filtered.filter((a) => a.handtrap);
          } else if (term == "Floodgate") {
            filtered = filtered.filter((a) => a.floodgate);
          } else if (term == "Show Rush") {
            filtered = filtered.filter((a) => a.rush);
            showall = true;
          } else if (term == "Show All") {
            showall = true;
          } else if (term.toUpperCase() == term) {
            filtered = filtered.filter((a) => a.attribute == term);
          } else {
            filtered = filtered.filter((a) => a.race == term);
          }
        }
        if (!showall) filtered = filtered.filter((a) => !a.rush);
        if (sort == "Popularity") {
          if (format == "dl" || format == "dlzg")
            filtered.sort((a, b) => a.popularityDl - b.popularityDl);
          if (format == "md")
            filtered.sort((a, b) => a.popularityMd - b.popularityMd);
          if (format == "tcg")
            filtered.sort((a, b) => a.popularityTcg - b.popularityTcg);
          if (format == "ocg")
            filtered.sort((a, b) => a.popularityOcg - b.popularityOcg);
        } else if (sort == "Rarity") {
          const rarityOrder = ["UR", "SR", "R", "N"];
          if (format == "dl" || format == "dlzg")
            filtered.sort((a, b) => {
              if (!a.rarityDl && b.rarityDl) return 1;
              if (a.rarityDl && !b.rarityDl) return -1;
              return (
                rarityOrder.indexOf(a.rarityDl) - rarityOrder.indexOf(b.rarityDl)
              );
            });
          if (format == "md")
            filtered.sort((a, b) => {
              if (!a.rarityMd && b.rarityMd) return 1;
              if (a.rarityMd && !b.rarityMd) return -1;
              return (
                rarityOrder.indexOf(a.rarityMd) - rarityOrder.indexOf(b.rarityMd)
              );
            });
        } else {
          filtered.sort((a, b) => a.name.localeCompare(b.name));
        }
        const more = filtered.length - limit;
        if (more > 0) filtered.length = limit;
        this.appendCards(filtered, targetDiv, width, "search");
        if (!filtered.length) {
          targetDiv.insertAdjacentHTML("beforeend", `<div class="emptynote">No cards found.</div>`);
        } else if (more > 0) {
          targetDiv.insertAdjacentHTML(
            "beforeend",
            `<div class="emptynote">${more} more ${more == 1 ? "card" : "cards"} not shown. Narrow the search.</div>`
          );
        }
      }
      //add a copy to the end of the shown deck; false (and this.refusal) if it can't be added
      addCard(name, mainDiv, extraDiv, width) {
        name = this.htmlDecode(name);
        const card = this.ygolDb.find((a) => a.name == name);
        if (!card) {
          this.refusal = "unknown";
          return false;
        }
        if (this.atLimit(name)) {
          this.refusal = "limit";
          return false;
        }
        if (this.editingDeck == "main") {
          this.cards.push(card);
          this.appendDeck(mainDiv, extraDiv, width);
        } else {
          this.side.push(card);
          this.appendSide(mainDiv, extraDiv, width);
        }
        return true;
      }
      //add a copy of a card at position index of the shown deck: location is "main" or "extra"
      //while the main deck is shown, "side" while the side deck is shown. Nothing is added if
      //the card doesn't belong there (e.g. a Fusion dropped on the main deck) or has 3 copies
      insertCardAt(name, location, index, mainDiv, extraDiv, width) {
        name = this.htmlDecode(name);
        const card = this.ygolDb.find((a) => a.name == name);
        this.refusal = this.dropRefusal(card, location);
        if (this.refusal) return false;
        if (location == "side") {
          this.side.splice(index, 0, card);
          this.appendSide(mainDiv, extraDiv, width);
          return true;
        }
        let main = this.cards.filter((a) => a.priorityDl < 2000000000);
        let extra = this.cards.filter((a) => a.priorityDl >= 2000000000);
        (location == "main" ? main : extra).splice(index, 0, card);
        this.cards = main.concat(extra);
        this.appendDeck(mainDiv, extraDiv, width);
        return true;
      }
      //why a card can't be dropped in a deck box ("main"/"extra" while the main deck is shown,
      //"side" while the side deck is shown), or null if it can
      dropRefusal(card, location) {
        if (!card) return "unknown";
        if ((location == "side") != (this.editingDeck == "side")) return "unknown";
        if (location != "side") {
          const isExtra = card.priorityDl >= 2000000000;
          if (location == "main" && isExtra) return "extra";
          if (location == "extra" && !isExtra) return "main";
        }
        if (this.atLimit(card.name)) return "limit";
        return null;
      }
      //the deck that isn't shown: "side" while the main deck is shown, "main" while the side is
      otherDeck() {
        return this.editingDeck == "main" ? "side" : "main";
      }
      //move card number `cardno` of a deck box ("main", "extra" or "side") to the end of the
      //other deck (main/extra <-> side). The number of copies doesn't change, so no limit check
      moveToOtherDeck(cardno, location, mainDiv, extraDiv, width) {
        cardno = Number(cardno);
        let main = this.cards.filter((a) => a.priorityDl < 2000000000);
        let extra = this.cards.filter((a) => a.priorityDl >= 2000000000);
        let list = location == "side" ? this.side : location == "main" ? main : extra;
        const card = list[cardno];
        if (!card) return null;
        list.splice(cardno, 1);
        if (location == "side") {
          this.cards.push(card);
        } else {
          this.cards = main.concat(extra);
          this.side.push(card);
        }
        this.render(mainDiv, extraDiv, width);
        return card;
      }
      //add a copy to the end of the deck that isn't shown; false (and this.refusal) if it can't
      addToOtherDeck(name, mainDiv, extraDiv, width) {
        name = this.htmlDecode(name);
        const card = this.ygolDb.find((a) => a.name == name);
        if (!card) {
          this.refusal = "unknown";
          return false;
        }
        if (this.atLimit(name)) {
          this.refusal = "limit";
          return false;
        }
        if (this.editingDeck == "main") this.side.push(card);
        else this.cards.push(card);
        this.render(mainDiv, extraDiv, width);
        return true;
      }
      //add another copy of a deck card right after it (to its right), keeping the 3-copy limit
      insertCopyAfter(cardno, location, mainDiv, extraDiv, width) {
        cardno = Number(cardno);
        let main = this.cards.filter((a) => a.priorityDl < 2000000000);
        let extra = this.cards.filter((a) => a.priorityDl >= 2000000000);
        let list = location == "side" ? this.side : location == "main" ? main : extra;
        let card = list[cardno];
        if (!card) {
          this.refusal = "unknown";
          return false;
        }
        if (this.atLimit(card.name)) {
          this.refusal = "limit";
          return false;
        }
        list.splice(cardno + 1, 0, card);
        if (location != "side") this.cards = main.concat(extra);
        this.render(mainDiv, extraDiv, width);
        return true;
      }
      removeCard(cardno1, location, mainDiv, extraDiv, width) {
        let main = this.cards.filter((a) => a.priorityDl < 2000000000);
        let extra = this.cards.filter((a) => a.priorityDl >= 2000000000);
        if (location == "side") {
          this.side.splice(cardno1, 1);
        } else {
          if (location == "main") main.splice(cardno1, 1);
          if (location == "extra") extra.splice(cardno1, 1);
          this.cards = main.concat(extra);
        }
        this.render(mainDiv, extraDiv, width);
      }
      exportNamelist() {
        let main = "#main\n";
        let extra = "#extra\n";
        let side = "!side\n";
        for (let el of this.cards) {
          if (el.priorityDl < 2000000000) {
            main += el.name + "\n";
          } else {
            extra += el.name + "\n";
          }
        }
        for (let el of this.side) {
          side += el.name + "\n";
        }
        return main + extra + side;
      }
